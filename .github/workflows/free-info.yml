name: free-info

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      cadence_hours:
        description: "Fetch cadence hours: 1, 3, 6, 12, 24"
        required: false
        default: ""
      force:
        description: "Force fetch now"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply cadence input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cadence_hours != '' }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          value = int("${{ inputs.cadence_hours }}")
          if value not in {1, 3, 6, 12, 24}:
              raise SystemExit("cadence_hours must be one of 1,3,6,12,24")
          path = Path("data/free_info_schedule.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["cadenceHours"] = value
          data["updatedAt"] = datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - run: python scripts/fetch_free_info.py
        env:
          FREE_INFO_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == 'true' }}
      - name: Commit updates
        run: |
          git config user.name "codexgate-bot"
          git config user.email "codexgate-bot@users.noreply.github.com"
          git add data/free_info_schedule.json latest/data/free-info.json latest/data/ai-info.json latest/data/weather-info.json latest/data/gate-health.json latest/data/free-source-catalog.json latest/data/codexgate-news-brief-2026-09-03.md
          git diff --cached --quiet || git commit -m "update free info"
          git push
