name: free-info

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_free_info.py
      - name: Commit updates
        run: |
          git config user.name "codexgate-bot"
          git config user.email "codexgate-bot@users.noreply.github.com"
          git add latest/data/free-info.json latest/data/ai-info.json latest/data/weather-info.json latest/data/gate-health.json latest/data/codexgate-news-brief-2026-09-03.md
          git diff --cached --quiet || git commit -m "update free info"
          git push
