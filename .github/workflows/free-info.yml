name: free-info

on:
  schedule:
    - cron: "7-57/10 * * * *"
  workflow_dispatch:
    inputs:
      cadence_minutes:
        description: "Fetch cadence minutes: 10, 30, 60, 180, 360, 720, 1440"
        required: false
        default: ""
      force:
        description: "Force fetch now"
        required: false
        default: "false"

concurrency:
  group: free-info-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check fetch policy
        run: python scripts/check_free_info_z1.py
      - name: Apply cadence input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cadence_minutes != '' }}
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          value = int("${{ inputs.cadence_minutes }}")
          if value not in {10, 30, 60, 180, 360, 720, 1440}:
              raise SystemExit("cadence_minutes must be one of 10,30,60,180,360,720,1440")
          path = Path("data/free_info_schedule.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["cadenceMinutes"] = value
          data["updatedAt"] = datetime.now(timezone.utc).isoformat()
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - run: python scripts/fetch_free_info.py
        env:
          FREE_INFO_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == 'true' }}
      - name: Commit updates
        run: |
          git config user.name "codexgate-bot"
          git config user.email "codexgate-bot@users.noreply.github.com"
          git add data/free_info_schedule.json data/free_sources_v2.json data/free_info_state.json latest/data/free-info.json latest/data/ai-info.json latest/data/weather-info.json latest/data/gate-health.json latest/data/free-source-catalog.json latest/data/social-trends.json latest/data/codexgate-news-brief-2026-09-03.md
          git diff --cached --quiet || git commit -m "update free info"
          git push
      - name: Verify Pages source route
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          expected = json.load(open("latest/data/free-info.json", encoding="utf-8"))["updatedAt"]
          url = "https://gouchin0326-source.github.io/codex-mobile-gate/latest/data/free-info.json"
          for attempt in range(12):
              try:
                  request = urllib.request.Request(f"{url}?z1={time.time_ns()}", headers={"User-Agent": "CODEXGATE-PagesCheck/1.0"})
                  with urllib.request.urlopen(request, timeout=10) as response:
                      actual = json.load(response).get("updatedAt")
                  if actual == expected:
                      print(f"Pages published: {actual}")
                      break
              except Exception as exc:
                  print(f"Pages check {attempt + 1}: {exc}")
              time.sleep(10)
          else:
              raise SystemExit(f"Pages did not publish expected updatedAt={expected}")
          PY
