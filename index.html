<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172033">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>CG | CODEX Gate</title>
  <style>
    :root {
      --bg: #f5f1e8;
      --panel: #fffdf8;
      --ink: #172033;
      --muted: #657083;
      --line: #d7cdbc;
      --blue: #1d5fd1;
      --green: #19744a;
      --amber: #bc7613;
      --rose: #b44c5f;
      font-family: "Segoe UI", "Meiryo", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      letter-spacing: 0;
      line-height: 1.45;
    }

    .wrap {
      width: min(980px, calc(100% - 20px));
      margin-inline: auto;
    }

    header {
      background: #172033;
      color: white;
      padding: 12px 0 10px;
      border-bottom: 4px solid var(--amber);
    }

    .top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      line-height: 1;
      letter-spacing: 0;
    }

    .tagline {
      margin: 3px 0 0;
      color: #dce5f3;
      font-size: .78rem;
      font-weight: 700;
    }

    .date {
      border: 1px solid rgba(255, 255, 255, .22);
      padding: 5px 8px;
      color: #dce5f3;
      font-size: .72rem;
      font-weight: 800;
      white-space: nowrap;
    }

    main {
      display: grid;
      gap: 8px;
      padding: 8px 0 22px;
    }

    section,
    a.tile {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      text-decoration: none;
    }

    section { padding: 10px; }

    h2 {
      margin: 0 0 7px;
      font-size: .92rem;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .metrics,
    .shelf {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .metric {
      min-width: 0;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbf8f0;
    }

    .metric strong {
      display: block;
      font-size: 1.35rem;
      line-height: 1;
    }

    .metric span,
    .muted {
      color: var(--muted);
      font-size: .72rem;
    }

    .tile {
      min-height: 74px;
      padding: 9px;
      display: grid;
      align-content: space-between;
      border-top: 5px solid var(--blue);
    }

    .tile:nth-child(2) { border-top-color: var(--green); }
    .tile:nth-child(3) { border-top-color: var(--amber); }
    .tile:nth-child(4) { border-top-color: var(--rose); }

    .tile strong {
      display: block;
      font-size: .86rem;
      line-height: 1.2;
    }

    .tile small {
      color: var(--muted);
      font-size: .68rem;
      line-height: 1.25;
    }

    .lane-now {
      display: grid;
      grid-template-columns: 84px 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .badge {
      display: grid;
      place-items: center;
      min-height: 62px;
      border-radius: 8px;
      background: #172033;
      color: white;
      font-size: .78rem;
      font-weight: 900;
      text-align: center;
      padding: 6px;
    }

    .lane-now strong {
      display: block;
      font-size: .96rem;
      line-height: 1.25;
    }

    .lane-now p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: .76rem;
    }

    .go {
      min-height: 44px;
      padding: 9px 11px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--blue);
      color: white;
      text-decoration: none;
      font-size: .78rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .step {
      padding: 7px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: #fbf8f0;
      font-size: .72rem;
      font-weight: 800;
      text-align: center;
    }

    @media (max-width: 520px) {
      .wrap { width: min(100% - 14px, 420px); }
      header { padding-top: 9px; }
      h1 { font-size: 1.85rem; }
      .tagline { font-size: .7rem; }
      main { gap: 6px; padding-top: 6px; }
      section { padding: 8px; }
      .metrics { grid-template-columns: repeat(4, 1fr); }
      .metric { padding: 6px 5px; }
      .metric strong { font-size: 1.05rem; }
      .metric span { font-size: .62rem; }
      .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tile { min-height: 62px; padding: 7px; }
      .lane-now { grid-template-columns: 58px 1fr 58px; gap: 6px; }
      .badge { min-height: 52px; font-size: .66rem; }
      .lane-now strong { font-size: .82rem; }
      .lane-now p { font-size: .66rem; }
      .go { min-height: 42px; padding: 7px; font-size: .68rem; }
      .flow { grid-template-columns: repeat(4, 1fr); }
      .step { padding: 6px 2px; font-size: .62rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap top">
      <div>
        <h1>CG</h1>
        <p class="tagline">CODEX Gate / 一画面で見る開発入口</p>
      </div>
      <div class="date">2026-07-24</div>
    </div>
  </header>

  <main class="wrap">
    <section aria-label="status summary">
      <div class="metrics">
        <div class="metric"><strong>11</strong><span>アプリ</span></div>
        <div class="metric"><strong>12</strong><span>企画</span></div>
        <div class="metric"><strong>17</strong><span>成果物</span></div>
        <div class="metric"><strong>6</strong><span>レーン</span></div>
      </div>
    </section>

    <section>
      <h2>棚から開く</h2>
      <div class="shelf">
        <a class="tile" href="./latest/dashboard.html"><strong>CSD</strong><small>詳細チェック</small></a>
        <a class="tile" href="./latest/app-launcher.html"><strong>アプリ棚</strong><small>全アプリ</small></a>
        <a class="tile" href="./latest/cat-affinity-lane/index.html"><strong>猫レーン</strong><small>新しい体験</small></a>
        <a class="tile" href="./latest/csd-designer-showcase/index.html"><strong>デザイン</strong><small>見せ方の例</small></a>
      </div>
    </section>

    <section>
      <h2>最新レーン</h2>
      <div class="lane-now">
        <div class="badge">NEW<br>LANE</div>
        <div>
          <strong>猫が好きになるコンテンツ</strong>
          <p>写真、短い観察、触れる反応で「猫を見てみたい」に寄せる小さな体験。</p>
        </div>
        <a class="go" href="./latest/cat-affinity-lane/index.html">開く</a>
      </div>
    </section>

    <section>
      <h2>レーンの作り方</h2>
      <div class="flow" aria-label="lane flow">
        <div class="step">目的</div>
        <div class="step">実作</div>
        <div class="step">検証</div>
        <div class="step">CG掲載</div>
      </div>
      <p class="muted">共有Driveのレーン知見を反映。レーンは説明ではなく、CGに載る成果物まで作る単位。</p>
    </section>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
