<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172033">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>CODEX Gate</title>
  <style>
    :root { --bg:#f6f7f9; --panel:#fff; --ink:#172033; --muted:#667085; --line:#d9dee7; --blue:#2563eb; --green:#15803d; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--ink); letter-spacing:0; }
    header { background:#172033; color:#fff; padding:16px; }
    h1 { margin:0 0 4px; font-size:24px; }
    main { padding:10px; max-width:760px; margin:0 auto; display:grid; gap:10px; }
    section, a.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; color:var(--ink); text-decoration:none; }
    .muted { color:var(--muted); font-size:12px; }
    .grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
    .metric strong { display:block; font-size:26px; }
    .metric span { color:var(--muted); font-size:12px; }
    .card strong { display:block; font-size:16px; margin-bottom:4px; }
    .ok { color:var(--green); font-weight:700; }
    code { font-family:Consolas, monospace; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <h1>CODEX Gate</h1>
    <div>スマホ用入口 / 節約モード</div>
  </header>
  <main>
    <section>
      <strong>トークン</strong>
      <div class="grid">
        <div class="metric"><strong>87%</strong><span>使用済み</span></div>
        <div class="metric"><strong>13%</strong><span>残り</span></div>
        <div class="metric"><strong>6日</strong><span>期限まで</span></div>
        <div class="metric"><strong>2.17%</strong><span>1日上限</span></div>
      </div>
    </section>
    <a class="card" href="./latest/index.html">
      <strong>Mobile Dashboard</strong>
      <div class="muted">成果物・節約状況・リンク集</div>
    </a>
    <a class="card" href="./latest/quick-notes-board/index.html">
      <strong>Quick Notes Board</strong>
      <div class="muted">todo / waiting / done</div>
    </a>
    <a class="card" href="./latest/orbit-catcher/index.html">
      <strong>Orbit Catcher</strong>
      <div class="muted">ミニゲーム</div>
    </a>
    <section>
      <strong>Google Drive</strong>
      <div class="muted">同期先: <code>G:\マイドライブ\CODEX\latest</code></div>
      <div class="ok">ローカルLLM/GPU不使用</div>
    </section>
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
