<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>猫素材研究室 | CG</title>
  <style>
    :root{--ink:#2f241c;--cream:#fff8e8;--paper:#fffdf8;--line:#d9c7a7;--orange:#e57f35;--brown:#754c2d;--mint:#d7efe5}
    *{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:#efe1c6;color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif}header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 9px;background:#fffaf0ee;border-bottom:2px solid var(--line);backdrop-filter:blur(8px)}h1{font-size:17px;margin:0}.back{color:var(--brown);font-weight:800;text-decoration:none}.load{white-space:nowrap;font-size:9px;font-weight:800;padding:5px 6px;border-radius:999px;background:var(--mint)}main{width:min(100%,460px);min-width:0;margin:auto;padding:10px;display:grid;gap:10px}.card{min-width:0;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 4px 0 #cdbb9c}canvas{display:block;width:100%;max-width:100%;min-width:0;aspect-ratio:390/460;background:#f5e7c9;border-radius:12px;image-rendering:pixelated}.label{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.label b{font-size:14px}.label span{font-size:11px;color:#705c4a}.cats,.dirs,.toggles{min-width:0;display:grid;gap:6px}.cats{grid-template-columns:repeat(4,minmax(0,1fr))}.dirs{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:8px}.toggles{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:8px}button{min-width:0;min-height:44px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:800 13px inherit;cursor:pointer}button[aria-pressed="true"]{border-color:var(--orange);box-shadow:inset 0 0 0 2px #fff,0 0 0 2px var(--orange);background:#fff0db}.data{display:grid;grid-template-columns:1fr 1fr;gap:6px}.datum{padding:8px;border-radius:10px;background:#f5ead7}.datum small{display:block;color:#806a56}.datum b{font-size:13px}.patterns{display:flex;flex-wrap:wrap;gap:6px}.patterns span{padding:6px 8px;border-radius:999px;background:#ede2ff;font-size:11px;font-weight:800}pre{margin:0;white-space:pre-wrap;word-break:break-all;padding:10px;background:#211b2d;color:#f8f3ff;border-radius:10px;font-size:11px}.copy{width:100%;margin-top:8px;background:var(--brown);border-color:var(--brown);color:#fff}footer{text-align:center;padding:6px 8px 18px;color:#705c4a;font-size:11px}@media(min-width:700px){main{width:min(920px,100%);grid-template-columns:1.05fr .95fr}.viewer{grid-row:span 4}}
  </style>
</head>
<body>
  <header><a class="back" href="../index.html">← CG</a><h1>猫素材研究室</h1><span class="load" title="Canvas 1 / RAF 1 / 外部画像 0">C1・R1・画像0</span></header>
  <main>
    <section class="card viewer"><div class="label"><b>共通猫ルーム</b><span>全アプリ共通素材</span></div><canvas id="room" width="390" height="460" aria-label="猫の部屋と8方向モーション見本"></canvas></section>
    <section class="card"><div class="label"><b>猫を選ぶ</b><span id="selected-name">モカ・茶トラ</span></div><div class="cats" id="cats"></div><div class="dirs" id="dirs"></div><div class="toggles"><button id="walk" type="button" aria-pressed="true">歩行 ON</button><button id="motion" type="button" aria-pressed="true">仕草 ON</button></div></section>
    <section class="card"><div class="label"><b>開発ベースデータ</b><span id="version"></span></div><div class="data"><div class="datum"><small>ID</small><b id="cat-id"></b></div><div class="datum"><small>毛柄</small><b id="coat"></b></div><div class="datum"><small>アクセサリー</small><b id="accessory"></b></div><div class="datum"><small>描画方向</small><b id="direction"></b></div></div></section>
    <section class="card"><div class="label"><b>収録仕草</b><span>軽量座標アニメ</span></div><div class="patterns"><span>斜め4方向専用姿勢</span><span>四足歩行</span><span>まばたき</span><span>微呼吸</span><span>耳ぴく</span><span>尻尾</span><span>高精細LOD</span></div></section>
    <section class="card"><div class="label"><b>アプリ利用コード</b><span>HTML First</span></div><pre id="code"></pre><button class="copy" id="copy" type="button">コードをコピー</button></section>
  </main>
  <footer>猫の見た目は shared/cats、能力・武器・セーブは各ゲーム側で管理します。</footer>
  <script src="../shared/cats/cat-assets.js"></script>
  <script src="../shared/cats/cat-core.js"></script>
  <script>
    const canvas=document.querySelector("#room"),ctx=canvas.getContext("2d"),dirMarks=["→","↘","↓","↙","←","↖","↑","↗"],accessories={bell:"鈴",ribbon:"リボン",star:"星",leaf:"葉っぱ"};
    const state={catId:"moka",direction:1,walking:true,motion:true,phase:0,last:performance.now()};
    function button(text,pressed,run){const el=document.createElement("button");el.type="button";el.textContent=text;el.setAttribute("aria-pressed",pressed);el.onclick=run;return el}
    function buildControls(){const cats=document.querySelector("#cats"),dirs=document.querySelector("#dirs");HoshiCats.cats.forEach(cat=>cats.append(button(cat.name,cat.id===state.catId,()=>{state.catId=cat.id;sync()})));dirMarks.forEach((mark,i)=>dirs.append(button(`${mark} ${i}`,i===state.direction,()=>{state.direction=i;sync()})))}
    function sync(){const cat=HoshiCats.getCat(state.catId);[...document.querySelector("#cats").children].forEach((b,i)=>b.setAttribute("aria-pressed",HoshiCats.cats[i].id===state.catId));[...document.querySelector("#dirs").children].forEach((b,i)=>b.setAttribute("aria-pressed",i===state.direction));document.querySelector("#selected-name").textContent=`${cat.name}・${cat.coat}`;document.querySelector("#cat-id").textContent=cat.id;document.querySelector("#coat").textContent=cat.coat;document.querySelector("#accessory").textContent=accessories[cat.accessory];document.querySelector("#direction").textContent=`${dirMarks[state.direction]} ${state.direction}/7`;document.querySelector("#version").textContent=`HoshiCats v${HoshiCats.version}`;document.querySelector("#code").textContent=`HoshiCats.draw(ctx,{\n  x:100,y:100,catId:"${cat.id}",\n  direction:${state.direction},walking:${state.walking},\n  phase:time,motion:${state.motion},detail:false\n});`}
    function room(){ctx.clearRect(0,0,390,460);ctx.fillStyle="#f7dfb9";ctx.fillRect(0,0,390,185);ctx.fillStyle="#9e744e";ctx.fillRect(0,185,390,275);ctx.fillStyle="#c99862";for(let y=190;y<460;y+=34){ctx.fillRect(0,y,390,2)}ctx.fillStyle="#b9e3ef";ctx.fillRect(24,24,94,80);ctx.fillStyle="#fff8";ctx.fillRect(67,24,5,80);ctx.fillRect(24,62,94,5);ctx.fillStyle="#76502f";ctx.fillRect(278,34,82,12);ctx.fillRect(288,46,8,79);ctx.fillRect(342,46,8,79);ctx.fillStyle="#dc8d55";ctx.fillRect(145,122,100,40);ctx.fillStyle="#f7c6a5";ctx.fillRect(153,130,84,28);ctx.fillStyle="#6e4a2d";ctx.font="900 13px Segoe UI";ctx.textAlign="center";ctx.fillText("みんなの猫素材",195,18);const spots=[[62,153],[136,169],[256,169],[330,153]];HoshiCats.cats.forEach((cat,i)=>HoshiCats.draw(ctx,{x:spots[i][0],y:spots[i][1],cat,direction:(i*2+state.direction)%8,walking:state.walking,phase:state.phase+i,motion:state.motion,scale:.72}));ctx.fillStyle="#5b3b29";ctx.fillRect(16,198,358,2);ctx.fillStyle="#f8d889";ctx.fillRect(104,214,182,74);ctx.fillStyle="#eaa35c";ctx.fillRect(115,224,160,54);HoshiCats.draw(ctx,{x:195,y:275,catId:state.catId,direction:state.direction,walking:state.walking,phase:state.phase,motion:state.motion,scale:1.55});ctx.fillStyle="#fff8e8";ctx.fillRect(12,306,366,142);ctx.fillStyle="#6e4a2d";ctx.font="800 11px Segoe UI";ctx.fillText("8方向チェック",195,322);for(let i=0;i<8;i++){const x=53+(i%4)*95,y=365+Math.floor(i/4)*67;ctx.fillStyle=i===state.direction?"#ffe0b2":"#efe5d4";ctx.fillRect(x-38,y-32,76,54);HoshiCats.draw(ctx,{x,y: y+12,catId:state.catId,direction:i,walking:state.walking,phase:state.phase+i,motion:state.motion,scale:.55});ctx.fillStyle="#5b3b29";ctx.font="900 11px Segoe UI";ctx.fillText(dirMarks[i],x,y-18)}}
    function frame(now){const dt=Math.min(.05,(now-state.last)/1000);state.last=now;if(state.walking)state.phase+=dt*8;room();requestAnimationFrame(frame)}
    document.querySelector("#walk").onclick=e=>{state.walking=!state.walking;e.currentTarget.setAttribute("aria-pressed",state.walking);e.currentTarget.textContent=`歩行 ${state.walking?"ON":"OFF"}`;sync()};document.querySelector("#motion").onclick=e=>{state.motion=!state.motion;e.currentTarget.setAttribute("aria-pressed",state.motion);e.currentTarget.textContent=`仕草 ${state.motion?"ON":"OFF"}`;sync()};document.querySelector("#copy").onclick=async e=>{try{await navigator.clipboard.writeText(document.querySelector("#code").textContent);e.currentTarget.textContent="コピーしました";setTimeout(()=>e.currentTarget.textContent="コードをコピー",1200)}catch{e.currentTarget.textContent="長押しでコピー"}};
    buildControls();sync();requestAnimationFrame(frame);
  </script>
</body>
</html>
