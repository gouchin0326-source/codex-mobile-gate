<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex残量 | CODEXGATE</title>
  <style>
    :root{--bg:#f4f6f8;--panel:#fff;--ink:#172033;--muted:#667085;--line:#d9dee7;--blue:#2563eb;--green:#15803d;--amber:#b45309;--rose:#b4235a;font-family:"Segoe UI","Meiryo",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.45}.wrap{width:min(920px,calc(100% - 18px));margin:auto}header{background:#172033;color:#fff;padding:14px 0;border-bottom:4px solid var(--blue)}h1{margin:0;font-size:1.6rem}.sub{margin:4px 0 0;color:#dce5f3;font-weight:900;font-size:.9rem}main{display:grid;gap:10px;padding:10px 0 26px}section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}h2{font-size:1.05rem;margin:0 0 8px}.decision{border:1px solid var(--line);border-radius:8px;background:#f0fdf4;padding:10px}.decision b{display:block;font-size:1.2rem}.decision span{font-size:1rem;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.box{border:1px solid var(--line);border-radius:8px;background:#f9fafb;padding:10px}.box b{display:block;font-size:1.5rem}.box span{display:block;color:var(--muted);font-size:.9rem;font-weight:800}.plan{display:grid;gap:8px}.task{border:1px solid var(--line);border-radius:8px;background:#f9fafb;padding:10px}.task b{display:block;font-size:1.04rem}.task span{display:block;font-size:.94rem;font-weight:900}.task small{display:block;color:var(--muted);font-size:.84rem;font-weight:800;margin-top:4px}.meter{height:14px;border-radius:8px;background:#e5e7eb;overflow:hidden;margin-top:8px}.fill{height:100%;background:var(--green)}.credits{display:grid;gap:8px}.credit{border:1px solid var(--line);border-radius:8px;background:#fff7ed;padding:10px}.credit b{display:block;font-size:1.05rem}.credit span{display:block;font-size:.94rem;font-weight:900}.meta{color:var(--muted);font-size:.88rem;font-weight:800}.back{display:inline-grid;place-items:center;min-height:40px;padding:8px 12px;border-radius:8px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900}@media(max-width:560px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><div class="wrap"><h1>Codex残量</h1><p class="sub">Codex内取得 / 低頻度更新 / GitHub Actions単独取得は不可</p></div></header>
  <main class="wrap">
    <section><h2>判断</h2><div class="decision" id="decision"><b>読込中</b><span>残量確認中</span></div></section>
    <section><h2>枠</h2><div class="grid" id="limits"></div></section>
    <section><h2>リセット券</h2><div class="credits" id="credits"></div></section>
    <section><h2>指示出し</h2><div class="plan" id="plan"></div></section>
    <section><h2>扱い</h2><p class="meta" id="meta">Codex内部状態のスナップショット。古い時はこのアプリ更新を指示。</p></section>
    <a class="back" href="../index.html">CGへ戻る</a>
  </main>
  <script>
    fetch("../data/codex-usage-snapshot.json?v="+Date.now()).then(r=>r.ok?r.json():null).then(data=>{
      if(!data)return;
      document.querySelector("#decision").innerHTML=`<b>${data.decision.line1}</b><span>${data.decision.line2}</span>`;
      document.querySelector("#limits").innerHTML=[data.primary,data.secondary].map(x=>`<div class="box"><b>${x.remainingPercent}%残</b><span>${x.label} / 使用${x.usedPercent}% / reset ${x.resetsAt.slice(5,16).replace("T"," ")}</span><div class="meter"><div class="fill" style="width:${x.remainingPercent}%"></div></div></div>`).join("");
      const rc=data.resetCredits||{};
      document.querySelector("#credits").innerHTML=`<div class="credit"><b>${rc.availableCount||0}枚 / 最短 ${String(rc.nearestExpiresAt||"期限不明").slice(5,16).replace("T"," ")}</b><span>${rc.policy||"期限情報なし"}</span></div>`+(rc.credits||[]).map(x=>`<div class="credit"><b>${String(x.expiresAt||"期限不明").slice(5,16).replace("T"," ")}</b><span>${x.status||""} / ${x.title||"reset"}</span></div>`).join("");
      document.querySelector("#plan").innerHTML=(data.taskPlan||[]).map(x=>`<div class="task"><b>${x.label}</b><span>${x.action}</span><small>${x.condition}</small></div>`).join("");
      document.querySelector("#meta").textContent=`更新 ${data.updatedAt} / ${data.source} / reset券 ${rc.availableCount||0}`;
    }).catch(()=>{});
  </script>
</body>
</html>
