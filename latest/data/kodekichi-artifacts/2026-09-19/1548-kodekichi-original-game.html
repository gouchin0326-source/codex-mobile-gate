<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>星くず回収隊｜コデ吉オリジナル</title><style>body{font:16px system-ui;max-width:560px;margin:auto;padding:20px;background:#effff5;color:#18364b}button{font:inherit;padding:14px;border:0;border-radius:12px;background:#147a55;color:#fff;font-weight:800;width:100%}#field{height:300px;position:relative;border-radius:20px;background:linear-gradient(#bdeba8,#58b87a);overflow:hidden}#hero,#star{position:absolute;font-size:2rem;transition:.2s}#hero{left:45%;top:70%}#star{left:65%;top:30%;cursor:pointer}.note{font-weight:800}</style><h1>🌱 星くず回収隊</h1><p class="note">コデ吉が作ったオリジナルゲーム。星を5個集めて庭を再生しよう。</p><div id="field"><span id="hero">🌱</span><button id="star" type="button">⭐</button></div><p id="score">回収 0 / 5</p><button id="play">星を回収する</button><script>let n=0;play.onclick=()=>{if(n<5){n++;score.textContent=`回収 ${n} / 5`;star.style.left=(15+Math.random()*70)+'%';star.style.top=(15+Math.random()*65)+'%';hero.style.transform=`rotate(${n%2?8:-8}deg)`}if(n===5)score.textContent='🌸 完成！コデ吉の庭が再生しました。'}</script>
