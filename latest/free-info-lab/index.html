<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>無料情報ラボ | CODEXGATE</title>
  <style>
    :root{--bg:#f4f6f8;--panel:#fff;--ink:#172033;--muted:#667085;--line:#d9dee7;--blue:#2563eb;--green:#15803d;--amber:#b45309;--rose:#b4235a;font-family:"Segoe UI","Meiryo",system-ui,sans-serif}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);line-height:1.45}.wrap{width:min(920px,calc(100% - 18px));margin:auto}
    header{background:#172033;color:#fff;padding:14px 0;border-bottom:4px solid var(--green)}h1{font-size:1.45rem;margin:0}.sub{margin:4px 0 0;color:#dce5f3;font-size:.78rem;font-weight:800}
    main{display:grid;gap:10px;padding:10px 0 28px}section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}h2{font-size:.98rem;margin:0 0 8px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{border:1px solid var(--line);border-radius:8px;background:#f9fafb;padding:10px}.card b{display:block;font-size:1rem}.card span{display:block;color:var(--muted);font-size:.9rem;font-weight:800}
    .icons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.icon{min-height:82px;display:grid;align-content:center;justify-items:center;gap:5px;text-decoration:none;color:var(--ink);border:1px solid transparent;border-radius:8px;text-align:center}.icon:hover,.icon:focus-visible{background:#fff;border-color:var(--blue)}
    .glyph{width:46px;height:46px;border-radius:14px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900}.g0{background:var(--green)}.g1{background:var(--amber)}.g2{background:var(--rose)}
    .feed{display:grid;gap:8px}.item{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px;background:#f9fafb;color:var(--ink);text-decoration:none}.item b{display:grid;place-items:center;min-height:44px;border-radius:10px;background:#172033;color:#fff;font-size:.9rem}.item span{font-size:1.05rem;font-weight:900;line-height:1.32}.item i{font-style:normal;color:var(--rose);font-weight:900;font-size:1.1rem}
    .muted{color:var(--muted);font-size:.88rem;font-weight:800}@media(max-width:560px){.grid{grid-template-columns:1fr}.icons{grid-template-columns:repeat(4,1fr);gap:5px}.glyph{width:42px;height:42px}.icon{min-height:74px}.icon span{font-size:.62rem}.item{grid-template-columns:44px 1fr 18px;padding:9px;gap:8px}.item b{min-height:38px;font-size:.78rem}.item span{font-size:1.04rem}}
  </style>
</head>
<body>
  <header><div class="wrap"><h1>無料情報ラボ</h1><p class="sub">Codexトークンを使わず、情報を集めてCGへ出す</p></div></header>
  <main class="wrap">
    <section>
      <h2>3段</h2>
      <div class="grid">
        <div class="card"><b>完全無料</b><span>ActionsがRSS/API取得。Codex 0%。</span></div>
        <div class="card"><b>少量</b><span>20行だけCodexへ渡し、CGへ反映。</span></div>
        <div class="card"><b>外部AI節約</b><span>調査/圧縮は外部AI。Codexは実装だけ。</span></div>
      </div>
    </section>
    <section>
      <h2>無料取得</h2>
      <div class="icons">
        <a class="icon" href="../data/free-info.json"><b class="glyph g0">全</b><span>JSON</span></a>
        <a class="icon" href="../data/codexgate-news-brief-2026-09-03.md"><b class="glyph g0">要</b><span>要約</span></a>
        <a class="icon" href="https://open-meteo.com/"><b class="glyph g0">天</b><span>天気</span></a>
        <a class="icon" href="https://earthquake.usgs.gov/earthquakes/feed/"><b class="glyph g0">揺</b><span>地震</span></a>
        <a class="icon" href="https://info.arxiv.org/help/rss.html"><b class="glyph g0">論</b><span>論文</span></a>
        <a class="icon" href="https://github.blog/changelog/feed/"><b class="glyph g0">開</b><span>開発</span></a>
        <a class="icon" href="https://lobste.rs/rss"><b class="glyph g0">技</b><span>技術</span></a>
        <a class="icon" href="../index.html"><b class="glyph g1">戻</b><span>CG</span></a>
      </div>
    </section>
    <section>
      <h2>最新</h2>
      <div class="feed" id="feed"><a class="item" href="../data/free-info.json"><b>待</b><span>取得待ち</span><i>!</i></a></div>
      <p class="muted" id="meta">GitHub Actionsで6時間ごとに更新</p>
    </section>
  </main>
  <script>
    fetch("../data/free-info.json?v="+Date.now()).then(r=>r.ok?r.json():null).then(data=>{
      if(!data||!Array.isArray(data.items))return;
      document.querySelector("#meta").textContent=`更新 ${data.updatedAt} / ${data.items.length}件 / error ${data.errors.length}`;
      document.querySelector("#feed").innerHTML=data.items.slice(0,10).map(item=>`<a class="item" href="${item.url}"><b>${item.genre}</b><span>${item.title}</span><i>${item.score>=3?"!":""}</i></a>`).join("");
    }).catch(()=>{});
  </script>
</body>
</html>
