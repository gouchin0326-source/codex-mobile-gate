<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>にゃんパニ！</title>
  <style>
    :root { --bg:#0b1020; --panel:#ffffff; --ink:#172033; --muted:#667085; --line:#d9dee7; --blue:#2563eb; --cyan:#0891b2; --green:#16a34a; --red:#dc2626; --amber:#d97706; --violet:#7c3aed; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:"Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--ink); letter-spacing:0; }
    header { min-height:58px; padding:12px 14px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; align-items:center; }
    h1 { margin:0; font-size:20px; }
    main { min-height:calc(100vh - 58px); display:grid; grid-template-columns:330px 1fr; }
    aside { background:var(--panel); border-right:1px solid var(--line); padding:12px; display:grid; gap:10px; align-content:start; }
    .stats { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
    .stat, .panel { border:1px solid var(--line); border-radius:8px; background:#fbfcfe; padding:10px; min-width:0; }
    .stat strong { display:block; font-size:22px; line-height:1.1; }
    .stat span, .muted { color:var(--muted); font-size:12px; }
    .panel { display:grid; gap:8px; }
    button { min-height:42px; border:1px solid var(--blue); border-radius:8px; background:var(--blue); color:#fff; font:inherit; font-weight:700; cursor:pointer; touch-action:manipulation; }
    button.secondary { background:#fff; color:var(--ink); border-color:var(--line); }
    .mission { border-color:#bae6fd; background:#f0f9ff; }
    .mission-title { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .mission-tag { color:#0369a1; font-size:12px; font-weight:800; }
    .mission-meter { height:8px; border-radius:999px; background:#dbeafe; overflow:hidden; }
    .mission-fill { height:100%; width:0%; background:#0891b2; transition:width .2s ease; }
    .legend { display:grid; gap:6px; font-size:13px; }
    .legend div { display:flex; align-items:center; gap:8px; }
    .gauges { display:grid; gap:8px; }
    .gauge-row { display:grid; grid-template-columns:54px 1fr auto; gap:8px; align-items:center; font-size:12px; color:var(--muted); }
    .gauge { height:9px; border-radius:999px; background:#e5e7eb; overflow:hidden; }
    .gauge-fill { height:100%; width:0%; background:var(--green); transition:width .18s ease; }
    .gauge-fill.ammo { background:var(--amber); }
    .loadout { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
    .slot { min-height:52px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); display:grid; gap:2px; place-items:center; padding:5px; }
    .slot strong { font-size:16px; line-height:1; }
    .slot span { color:var(--muted); font-size:11px; }
    .equip-grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
    .equip { min-height:48px; border:1px solid #c7d2fe; border-radius:8px; background:#eef2ff; display:grid; place-items:center; gap:2px; padding:5px; text-align:center; }
    .equip strong { font-size:14px; line-height:1; color:#3730a3; }
    .equip span { color:var(--muted); font-size:10px; }
    .dot { width:12px; height:12px; border-radius:999px; display:inline-block; }
    .dot.player { background:#38bdf8; }
    .dot.goal { background:var(--green); }
    .dot.zombie { background:var(--red); }
    .dot.item { background:var(--amber); }
    .play-wrap { min-height:100%; display:grid; grid-template-rows:minmax(0, 1fr) auto; gap:10px; padding:12px; }
    .stage { width:min(100%, 920px); aspect-ratio:4/3; align-self:center; justify-self:center; border:1px solid rgba(255,255,255,.18); border-radius:8px; background:#08111f; position:relative; overflow:hidden; box-shadow:0 16px 50px rgba(0,0,0,.3); }
    canvas { width:100%; height:100%; display:block; background:#08111f; }
    #ability-radar { width:100%; height:auto; background:#0f172a; border-radius:8px; }
    .overlay { position:absolute; inset:auto 12px 12px 12px; display:flex; justify-content:space-between; align-items:end; gap:8px; color:#dbeafe; pointer-events:none; font-size:12px; }
    .badge { display:inline-flex; align-items:center; min-height:26px; padding:3px 9px; border:1px solid rgba(255,255,255,.18); border-radius:999px; background:rgba(15,23,42,.72); backdrop-filter:blur(6px); }
    .status-line { min-height:18px; color:var(--muted); font-size:12px; }
    .controls { width:min(100%, 920px); justify-self:center; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; transition:opacity .18s; }
    .controls.inactive { opacity:.28; pointer-events:none; }
    .stick { width:138px; height:138px; border:1px solid #cbd5e1; border-radius:999px; background:radial-gradient(circle at center, #eff6ff 0 30%, #dbeafe 31% 100%); position:relative; justify-self:center; touch-action:none; user-select:none; }
    .stick::before { content:""; position:absolute; inset:20px; border:1px dashed #93c5fd; border-radius:999px; }
    .stick-knob { width:56px; height:56px; border-radius:999px; background:#1d4ed8; color:#fff; display:grid; place-items:center; font-size:12px; font-weight:800; position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); box-shadow:0 8px 20px rgba(37,99,235,.28); pointer-events:none; }
    .round { width:86px; height:86px; border-radius:999px; font-size:14px; }
    .ultimate { --charge:0%; background:conic-gradient(#f472b6 var(--charge),#334155 0); border-color:#f9a8d4; }
    .ultimate.ready { animation:ultimatePulse .55s steps(2,end) infinite; }
    @keyframes ultimatePulse { 50% { filter:brightness(1.45); transform:scale(1.06); } }
    .use-slot { background:#334155; border-color:#334155; color:#fff; display:grid; place-items:center; line-height:1.1; padding:4px; }
    .use-slot span { font-size:11px; font-weight:700; }
    .control-note { grid-column:1 / -1; color:var(--muted); font-size:12px; text-align:center; }
    .mobile-actions, .settings-head { display:none; }
    @media (max-width:920px) { main { grid-template-columns:1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } .stats { grid-template-columns:repeat(4, minmax(0,1fr)); } .stat { padding:8px; } .stat strong { font-size:17px; } .panel { display:none; } .panel.keep { display:grid; } .play-wrap { padding:8px; align-items:start; } .stage { width:100%; max-height:56vh; } }
    @media (max-width:560px) {
      html, body { width:100%; height:100%; overflow:hidden; overscroll-behavior:none; }
      body { min-height:var(--app-height,100svh); }
      header { display:none; }
      main { width:100%; height:var(--app-height,100svh); min-height:0; display:block; overflow:hidden; }
      aside { display:none; }
      body.settings-open aside { position:fixed; inset:0; z-index:40; width:100%; height:var(--app-height,100svh); padding:10px 10px calc(10px + env(safe-area-inset-bottom)); border:0; background:#fff; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; align-content:start; overflow:auto; }
      body.settings-open .settings-head, body.settings-open .stats, body.settings-open aside > button, body.settings-open aside > .status-line { grid-column:1/-1; }
      body.settings-open .settings-head { display:flex; justify-content:space-between; align-items:center; }
      body.settings-open .settings-head button { min-height:36px; padding:4px 14px; }
      body.settings-open .stats { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px; }
      body.settings-open .stat { min-height:44px; padding:5px 2px; text-align:center; }
      body.settings-open .stat strong { font-size:13px; }
      body.settings-open .stat span { font-size:8px; }
      body.settings-open aside > button { display:block; min-height:38px; }
      body.settings-open aside > .panel.keep { display:grid; grid-column:1/-1; }
      body.settings-open aside > .legend { display:none; }
      .play-wrap { width:100%; min-width:0; min-height:0; height:var(--app-height,100svh); padding:4px; display:grid; grid-template-rows:minmax(0,1fr) calc(112px + env(safe-area-inset-bottom)); gap:4px; overflow:hidden; }
      .stage { width:100%; height:100%; max-height:none; aspect-ratio:auto; align-self:stretch; border-radius:7px; }
      .mobile-actions { position:absolute; z-index:5; top:7px; right:7px; display:flex; gap:6px; }
      .mobile-actions button { width:42px; min-height:42px; padding:0; border-radius:50%; border-color:#ffffff55; background:#0f172ccc; font-size:17px; }
      canvas { touch-action:none; }
      .overlay { inset:auto 5px 5px 5px; font-size:9px; }
      .badge { min-height:19px; padding:1px 6px; }
      .controls { width:100%; height:88px; padding:4px 7px; align-self:start; grid-template-columns:minmax(80px,1fr) repeat(4,46px); gap:3px; border-radius:7px; overflow:hidden; }
      .stick { width:80px; height:80px; }
      .stick::before { inset:13px; }
      .stick-knob { width:36px; height:36px; font-size:9px; }
      .round { width:48px; height:48px; min-height:48px; font-size:9px; }
      .dash { background:#7c3aed; border-color:#a78bfa; }
      .use-slot span { font-size:8px; }
      .control-note { display:none; }
      .controls.inactive { opacity:.28; pointer-events:none; }
    }
  </style>
</head>
<body>
  <header><h1>にゃんパニ！</h1><div class="muted">猫の縄張りドタバタ大作戦</div></header>
  <main>
    <aside>
      <div class="settings-head"><strong>設定・記録</strong><button class="secondary" id="settings-close" type="button">閉じる</button></div>
      <div class="stats">

        <div class="stat"><strong id="wave">1</strong><span>周回</span></div><div class="stat"><strong id="hp">100</strong><span>耐久</span></div>
        <div class="stat"><strong id="ammo">12/90</strong><span>装填/予備</span></div><div class="stat"><strong id="weapon">単発</strong><span>武器</span></div>
        <div class="stat"><strong id="kills">0</strong><span>撃破</span></div><div class="stat"><strong id="distance">0m</strong><span>ゴール</span></div>
        <div class="stat"><strong id="boss">未出現</strong><span>ゲート番人</span></div><div class="stat"><strong id="ally">0</strong><span>仲間</span></div>
      </div>
      <button id="start">開始</button><button class="secondary" id="pause">一時停止</button><button class="secondary" id="sound">音 ON</button><button class="secondary" id="export-result">JSONを書き出し</button><button class="secondary" id="export-markdown">Markdownを書き出し</button><button class="secondary" id="export-ai-prompt">AI改善プロンプト</button><button class="secondary" id="reset-mission">ミッション更新</button><button class="secondary" id="reset-best">最高記録をリセット</button>
      <div class="status-line" id="export-status" role="status" aria-live="polite"></div>
      <div class="panel keep"><strong>状態</strong><div class="gauges"><div class="gauge-row"><span>耐久</span><div class="gauge"><div class="gauge-fill" id="hp-bar"></div></div><span id="hp-read">100</span></div><div class="gauge-row"><span>装填</span><div class="gauge"><div class="gauge-fill ammo" id="clip-bar"></div></div><span id="clip-read">12</span></div></div></div>
      <div class="panel keep"><strong>道具箱</strong><div class="loadout"><button class="slot" id="bag-slot-0"><strong>-</strong><span>空</span></button><button class="slot" id="bag-slot-1"><strong>-</strong><span>空</span></button></div></div>
      <div class="panel keep"><strong>RUN限定の戦闘成長</strong><canvas id="ability-radar" width="280" height="190" aria-label="今回の戦闘だけ有効な攻撃・速度・防御・回避・武器の能力レーダー"></canvas></div>
      <div class="panel keep"><strong>武器 重量10</strong><div class="equip-grid" id="weapon-loadout"><div class="equip"><strong>単</strong><span>肉球弾 Lv1 / 重1</span></div></div></div>
      <div class="panel mission keep"><div class="mission-title"><strong>今日のミッション</strong><span class="mission-tag" id="mission-reward">+0</span></div><div id="mission-text" class="muted"></div><div class="mission-meter" aria-hidden="true"><div class="mission-fill" id="mission-fill"></div></div><div class="muted" id="mission-progress"></div></div>
      <div class="panel keep"><strong>外部AI連携</strong><div class="muted">結果を書き出し、敵グラフィック・銃火器・音楽案は外部AIへ渡します。Codexは小さく確実に実装します。</div></div>
      <div class="panel legend"><div><span class="dot player"></span> 自機</div><div><span class="dot goal"></span> ゲート: 到達でクリア</div><div><span class="dot zombie"></span> ゾンビ: 接触で耐久低下</div><div><span class="dot item"></span> 弾薬/武器/回復</div></div>
    </aside>
    <div class="play-wrap">
      <div class="stage"><canvas id="game" width="920" height="690" aria-label="にゃんパニ！のゲーム画面"></canvas><div class="mobile-actions"><button id="mobile-start" type="button" aria-label="画面を切り替える">地図</button><button id="mobile-settings" type="button" aria-label="設定を開く">⚙</button></div><div class="overlay"><span class="badge" id="state">自宅</span><span class="badge" id="effect">通常</span></div></div>
      <div class="controls" aria-label="ゲーム操作パネル"><div class="stick" id="stick" aria-label="移動スティック" role="application"><div class="stick-knob" id="stickKnob">移動</div></div><button class="round dash" id="dash" type="button" aria-label="緊急回避"><strong>回避</strong><span id="dash-state">OK</span></button><button class="round ultimate" id="ultimate" type="button" aria-label="必殺技"><strong>必殺</strong><span id="ultimate-state">0%</span></button><button class="round use-slot" id="use-slot-0" aria-label="道具1"><strong>-</strong><span>道具1</span></button><button class="round use-slot" id="use-slot-1" aria-label="道具2"><strong>-</strong><span>道具2</span></button><div class="control-note">射撃とリロードは自動。回避中は無敵。PCはWASD/矢印、Spaceで回避。</div></div>
    </div>
  </main>

    function draw() { if(gameScene==="home"){drawHome();return}if(gameScene==="map"){drawTerritoryMap();return}if(gameScene==="shop"){drawWeaponShop();return}drawBackground();const z=viewZoom(),sx=screenShake?rand(-screenShake,screenShake):0,sy=screenShake?rand(-screenShake,screenShake):0;ctx.save();ctx.translate(sx,sy);ctx.scale(z,z);drawTerrain();drawGoal();items.forEach(drawItem);recruits.forEach(drawRecruit);bullets.forEach(drawProjectile);enemies.forEach(drawEnemy);drawBoss();allies.forEach(drawAlly);drawSpecialWeapons();drawPlayer();drawParticles();ctx.restore();if(screenFlash>0){ctx.fillStyle=`rgba(255,255,255,${Math.min(.65,screenFlash*4)})`;ctx.fillRect(0,0,canvas.width,canvas.height)}drawBossArrow();ctx.fillStyle="rgba(219,234,254,.92)";ctx.font="600 13px Segoe UI, sans-serif";ctx.textAlign="left";ctx.fillText(`危険${wave} / ${bossDefeated?"GOAL OPEN":boss?"BOSS出現":`討伐 ${kills}/${bossKillTarget}`} / 小判${battleCoins}`,10,18);drawGameGauges();drawMiniRadar();if(combo>1){ctx.fillStyle="#fbbf24";ctx.font="800 18px Segoe UI, sans-serif";ctx.fillText(`${combo} COMBO`,10,101)}drawPanic();drawPawStorm();drawCutin();if(!running&&score===0)drawTextCenter("▶で開始","ゲートへ到達せよ");if(paused)drawTextCenter("一時停止中","設定を閉じると再開します")}
    function syncViewportHeight(){const height=Math.floor(window.visualViewport?.height||window.innerHeight);document.documentElement.style.setProperty("--app-height",`${height}px`);}
    function resizeCanvas() { const rect=canvas.getBoundingClientRect(); if (matchMedia("(max-width:560px)").matches) { canvas.width=Math.max(240,Math.round(rect.width)); canvas.height=Math.max(240,Math.round(rect.height)); } else { canvas.width=920; canvas.height=690; } draw(); }
    function loop(now) { const dt = Math.min(.033, (now - lastTime) / 1000 || 0); lastTime = now; update(dt, now); draw(); requestAnimationFrame(loop); }
    function togglePause() { if (!running) return; paused = !paused; stateEl.textContent = paused ? "一時停止" : "進行中"; pauseButton.textContent = paused ? "再開" : "一時停止"; lastTime = performance.now(); }
    function downloadText(filename, text, type) { const blob = new Blob([text], { type }); const url = URL.createObjectURL(blob); const link = document.createElement("a"); link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url); exportStatusEl.textContent = `${filename} を書き出しました`; }
    function buildResultPayload() { return { exportedAt:new Date().toISOString(), game:"NYAN GATE RUN", codexGate:{ lane:"external-ai-assisted", policy:"Codexは小実装、敵グラフィック・銃・音楽案は外部AIへ渡す" }, world:{ ...world }, current:{ score, best, wave, hp:Number(hp.toFixed(1)), clip, reserveAmmo, inventory:[...inventory], shieldTime:Number(shieldTime.toFixed(1)), catnipTime:Number(catnipTime.toFixed(1)), feverTime:Number(feverTime.toFixed(1)), catLives, catCouncil, reloading:reloadTimer > 0, kills, clears, brutes, alliesMet, alliesLost, allies:allies.map((ally) => ({ type:ally.type, name:ally.name, hp:Number(ally.hp.toFixed(1)) })), boss:boss ? { hp:Number(boss.hp.toFixed(1)), maxHp:boss.maxHp, phase:boss.phase, x:Math.round(boss.x), y:Math.round(boss.y) } : null, gateLocked:Boolean(boss), distanceTravelled:Number(distanceTravelled.toFixed(1)), weaponSlots:weaponSlots.map(slot=>({...slot})), upgrades:{...upgrades}, player:{ x:Math.round(player.x), y:Math.round(player.y) }, goal:{ x:Math.round(goal.x), y:Math.round(goal.y) }, enemyCount:enemies.length, bulletCount:bullets.length, renderDetail, running, paused, mission:{ ...mission, progress:Math.floor(missionValue()), complete:missionComplete() } }, lastResult }; }
    function exportResult() { downloadText("orbit-catcher-gate-run-result.json", JSON.stringify(buildResultPayload(), null, 2), "application/json;charset=utf-8"); }
    function exportMarkdown() { const payload = buildResultPayload(); const r = payload.lastResult || payload.current; const lines = ["# NYAN GATE RUN 結果", "", `- 書き出し: ${payload.exportedAt}`, `- 得点: ${r.score}`, `- 最高: ${r.best}`, `- 周回: ${r.wave}`, `- 耐久: ${r.hp}`, `- 装填: ${r.clip}`, `- 予備弾: ${r.reserveAmmo}`, `- 撃破: ${r.kills}`, `- ゲート突破: ${r.clears}`, `- 大型撃破: ${r.brutes}`, `- 仲間合流: ${r.alliesMet ?? alliesMet}`, `- 仲間離脱: ${r.alliesLost ?? alliesLost}`, `- 移動距離: ${r.distanceTravelled}`, "", "## 猫部隊", "", `- 猫集会: ${r.catCouncil ?? catCouncil}匹`, `- 残機: ${r.catLives ?? catLives}`, "", "## 次の改善観点", "", "- 猫武器の組み合わせ効果", "- ボス別の猫リアクション", "- 30秒で印象が残るBGMループ"]; downloadText("nyan-gate-run-result.md", lines.join("\n"), "text/markdown;charset=utf-8"); }
    function exportAiPrompt() { const payload = buildResultPayload(); const text = `あなたはHTML5 Canvasの2D探索シューティング開発アドバイザーです。CODEXGATE/Orbit Catcherを、巨大マップ、ゾンビ、銃、弾薬補給、武器強化、効果音、ゲーム音楽を持つ作品へ育てています。Codexのトークンを節約するため、次の小さな実装単位を5つだけ、効果/難易度/仕様/外部AIに任せる素材案つきで提案してください。\n\n${JSON.stringify(payload, null, 2)}`; downloadText("orbit-catcher-gate-run-ai-prompt.txt", text, "text/plain;charset=utf-8"); }
    function setControl(name, value) { controls[name] = value; }
    function updateStickFromPointer(event) { const rect = stick.getBoundingClientRect(); const cx = rect.left + rect.width / 2; const cy = rect.top + rect.height / 2; const max = rect.width / 2 - 29; const rawX = event.clientX - cx; const rawY = event.clientY - cy; const dist = Math.hypot(rawX, rawY); const limited = Math.min(max, dist || 0); const angle = Math.atan2(rawY, rawX); const knobX = Math.cos(angle) * limited; const knobY = Math.sin(angle) * limited; stickState.x = max ? knobX / max : 0; stickState.y = max ? knobY / max : 0; stickState.power = Math.min(1, dist / max); stickKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`; }
    function triggerFlickBoost(dx,dy,duration){const len=Math.hypot(dx,dy);if(!running||paused||flickCooldown>0||duration>.42||len<30)return false;flickVX=dx/len;flickVY=dy/len;flickBoostTime=.34;flickCooldown=1.6;flash("フリック猫ダッシュ!");burst(player.x,player.y,"#67e8f9",12);tone(740,.06,"sine",.03);return true}
    function finishStick(event){triggerFlickBoost(event.clientX-stickState.gestureX,event.clientY-stickState.gestureY,(performance.now()-stickState.gestureAt)/1000);resetStick()}
    function resetStick() { stickState.active = false; stickState.x = 0; stickState.y = 0; stickState.power = 0; stickState.pointerId = null; stickKnob.style.transform = "translate(-50%, -50%)"; }
    function handleSceneTap(event) { const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)*canvas.width/rect.width,y=(event.clientY-rect.top)*canvas.height/rect.height;if(gameScene==="home"){const catIndex=roomCats.findIndex(cat=>Math.hypot(x-cat.x*canvas.width,y-cat.y*canvas.height)<38);if(catIndex>=0)selectRoomCat(catIndex);else if(x>canvas.width-110&&y>68&&y<134)setScene("shop");return true}if(gameScene==="map")return true;if(gameScene==="shop"){const hit=shopHit(x,y),type=hit&&shopWeaponTypes[hit.index];if(type&&hit.localY>hit.l.cardH-39){if(hit.localX<hit.l.cardW/2)toggleWeapon(type);else buyOrUpgradeWeapon(type)}return true}return false; }
    window.addEventListener("keydown", (event) => { const key = event.key.toLowerCase(); if (["arrowleft", "arrowright", "arrowup", "arrowdown", "a", "d", "w", "s", "shift", "control"].includes(key)) { event.preventDefault(); keys.add(key); } if (key === "p" && running) togglePause(); });
    window.addEventListener("keyup", (event) => keys.delete(event.key.toLowerCase()));
    canvas.addEventListener("pointermove", (event) => { const rect = canvas.getBoundingClientRect(); pointer.x = (event.clientX - rect.left) * canvas.width / rect.width; pointer.y = (event.clientY - rect.top) * canvas.height / rect.height; pointer.active = true; });
    canvas.addEventListener("pointerdown", (event) => { if(handleSceneTap(event))return;pointer.active = true; canvas.setPointerCapture(event.pointerId); });
    document.querySelectorAll("[data-control]").forEach((button) => { const name = button.dataset.control; button.addEventListener("pointerdown", (event) => { event.preventDefault(); setControl(name, true); button.setPointerCapture(event.pointerId); }); button.addEventListener("pointerup", () => setControl(name, false)); button.addEventListener("pointercancel", () => setControl(name, false)); button.addEventListener("pointerleave", () => setControl(name, false)); });
    stick.addEventListener("pointerdown", (event) => { event.preventDefault(); stickState.active = true; stickState.pointerId = event.pointerId;stickState.gestureX=event.clientX;stickState.gestureY=event.clientY;stickState.gestureAt=performance.now(); stick.setPointerCapture(event.pointerId); updateStickFromPointer(event); });
    stick.addEventListener("pointermove", (event) => { if (stickState.active && event.pointerId === stickState.pointerId) updateStickFromPointer(event); });
    stick.addEventListener("pointerup", (event) => { if (event.pointerId === stickState.pointerId) finishStick(event); });
    stick.addEventListener("pointercancel", resetStick);
    dashButton.addEventListener("click", performDash);
    ultimateButton.addEventListener("click", activateUltimate);
    startButton.addEventListener("click", primaryAction);
    mobileStartButton.addEventListener("click", primaryAction);
    mobileSettingsButton.addEventListener("click", () => { settingsPaused = running && !paused; if (settingsPaused) togglePause(); document.body.classList.add("settings-open"); });
    settingsCloseButton.addEventListener("click", () => { document.body.classList.remove("settings-open"); if (settingsPaused && paused) togglePause(); settingsPaused = false; });
    pauseButton.addEventListener("click", togglePause);
    soundButton.addEventListener("click", () => { audio.enabled = !audio.enabled; soundButton.textContent = audio.enabled ? "音 OFF" : "音 ON"; if (audio.enabled) { ensureAudio(); tone(660, .12, "sine", .045); } });

    resetBestButton.addEventListener("click", () => { best = 0; writeBest(0); updateHud(); exportStatusEl.textContent = "最高記録をリセットしました"; });
    bagButtons.forEach((button, index) => button.addEventListener("click", () => useInventory(index)));
    useButtons.forEach((button, index) => button.addEventListener("click", () => useInventory(index)));
    window.addEventListener("keydown", event => { if (event.code === "Space") { event.preventDefault(); performDash(); } if(event.key.toLowerCase()==="x")activateUltimate(); });
    window.addEventListener("resize", () => { syncViewportHeight(); resizeCanvas(); });
    window.visualViewport?.addEventListener("resize", () => { syncViewportHeight(); resizeCanvas(); });
    new ResizeObserver(resizeCanvas).observe(document.querySelector(".stage"));
    loadCampaign();homeCat.x=roomCats[selectedCatStyle].x;homeCat.y=roomCats[selectedCatStyle].y;rebuildWeaponSlots();syncViewportHeight(); updateHud(); setScene("home"); resizeCanvas(); requestAnimationFrame(loop);
