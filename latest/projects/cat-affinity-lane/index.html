<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>猫が好きになる小さな入口</title>
  <style>
    :root {
      --paper: #f6f0e6;
      --sheet: #fffdf8;
      --ink: #1d232b;
      --muted: #66707b;
      --line: #d9cdbc;
      --green: #2f7654;
      --amber: #c48226;
      --blue: #315caa;
      font-family: "Segoe UI", "Meiryo", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); line-height: 1.65; letter-spacing: 0; }
    .hero {
      min-height: 76svh;
      display: grid;
      align-items: end;
      position: relative;
      isolation: isolate;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background: url("assets/cat-hero.png") center / cover no-repeat;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(90deg, rgba(246, 240, 230, .98), rgba(246, 240, 230, .72) 42%, rgba(246, 240, 230, .08));
    }
    .wrap { width: min(960px, calc(100% - 28px)); margin-inline: auto; }
    .hero-inner { padding: 58px 0 48px; }
    .eyebrow { margin: 0 0 10px; font-weight: 900; color: var(--green); }
    h1 { margin: 0; max-width: 640px; font-size: clamp(2.1rem, 8vw, 5.2rem); line-height: .98; letter-spacing: 0; }
    .lead { max-width: 560px; margin: 18px 0 0; font-size: 1.08rem; font-weight: 700; }
    main { padding: 20px 0 38px; display: grid; gap: 12px; }
    section, .card {
      background: var(--sheet);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    h2 { margin: 0 0 10px; font-size: 1.25rem; line-height: 1.2; letter-spacing: 0; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .card { min-height: 150px; display: grid; align-content: space-between; }
    .card b { display: block; font-size: 1rem; }
    .card p, .muted { color: var(--muted); margin: 0; }
    .touch {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .meter {
      height: 16px;
      border-radius: 999px;
      background: #eadfce;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .bar {
      width: 18%;
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--amber));
      transition: width .25s ease;
    }
    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: white;
      padding: 10px 14px;
      font-weight: 900;
      cursor: pointer;
    }
    .export { display: flex; flex-wrap: wrap; gap: 8px; }
    textarea {
      width: 100%;
      min-height: 150px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      font-family: Consolas, "Courier New", monospace;
      resize: vertical;
    }
    @media (max-width: 720px) {
      .hero { min-height: 68svh; }
      .hero::after { background: linear-gradient(90deg, rgba(246,240,230,.98), rgba(246,240,230,.74)); }
      .grid, .touch { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="wrap hero-inner">
      <p class="eyebrow">CG Lane / Cat Affinity</p>
      <h1>猫を、少し好きになる。</h1>
      <p class="lead">かわいいだけで押さず、観察すると見えてくる静かな魅力から入るコンテンツです。</p>
    </div>
  </header>

  <main class="wrap">
    <section>
      <h2>好きになる3つの入口</h2>
      <div class="grid">
        <article class="card"><b>目</b><p>猫は長く見つめすぎると緊張します。ゆっくり瞬きを返すと、安心の合図になります。</p></article>
        <article class="card"><b>間</b><p>すぐ触らず、近くに座る。猫は距離を選べると、人を信用しやすくなります。</p></article>
        <article class="card"><b>しぐさ</b><p>しっぽ、耳、ひげを見ると、気分が読めます。小さな変化が会話になります。</p></article>
      </div>
    </section>

    <section>
      <h2>なでる前の親密度</h2>
      <div class="touch">
        <div>
          <div class="meter" aria-label="親密度"><div class="bar" id="bar"></div></div>
          <p class="muted" id="message">まずはそっと同じ空間にいます。</p>
        </div>
        <button type="button" id="observe">静かに観察する</button>
      </div>
    </section>

    <section>
      <h2>レーン出力</h2>
      <p class="muted">この猫レーンは、CG掲載、CSD確認、JSON/Markdown引き継ぎまで含む小さな成果物です。</p>
      <div class="export">
        <button type="button" data-export="json">JSON</button>
        <button type="button" data-export="markdown">Markdown</button>
      </div>
      <textarea id="out" readonly></textarea>
    </section>
  </main>

  <script>
    const lane = {
      id: "cat-affinity-lane",
      theme: "猫好きになるコンテンツ",
      purpose: "猫の魅力を、観察、距離、反応で体験できる入口にする。",
      checks: ["CG掲載", "CSD試行台帳", "HTML構文", "JSON/Markdown出力"],
      next: "触りすぎ注意や鳴き声の読み取りなど、反応パターンを増やす。"
    };
    let score = 18;
    const bar = document.querySelector("#bar");
    const message = document.querySelector("#message");
    const out = document.querySelector("#out");
    const messages = [
      "猫がこちらを一度見ました。",
      "耳が前を向きました。少し興味があります。",
      "ゆっくり瞬きを返してくれました。",
      "近くでくつろぎ始めました。距離感が合っています。"
    ];
    function render() {
      bar.style.width = Math.min(score, 100) + "%";
      message.textContent = messages[Math.min(Math.floor(score / 25), messages.length - 1)];
    }
    function markdown() {
      return `# ${lane.theme}\n\n- 目的: ${lane.purpose}\n- 検証: ${lane.checks.join(", ")}\n- 次: ${lane.next}`;
    }
    function setExport(mode) {
      out.value = mode === "markdown" ? markdown() : JSON.stringify(lane, null, 2);
    }
    document.querySelector("#observe").addEventListener("click", () => {
      score = Math.min(100, score + 18);
      render();
    });
    document.querySelectorAll("[data-export]").forEach((button) => {
      button.addEventListener("click", () => setExport(button.dataset.export));
    });
    render();
    setExport("json");
  </script>
</body>
</html>
