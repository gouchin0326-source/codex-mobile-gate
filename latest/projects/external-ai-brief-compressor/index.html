<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>外部AIブリーフ圧縮器</title>
  <style>
    :root {
      --bg:#f4f6f8; --panel:#fff; --ink:#172033; --muted:#667085; --line:#d9dee7;
      --blue:#2563eb; --green:#15803d; --amber:#b45309; --red:#b42318;
      font-family:"Segoe UI","Meiryo",system-ui,sans-serif;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); letter-spacing:0; line-height:1.45; }
    header { background:#172033; color:white; padding:14px; border-bottom:4px solid var(--blue); }
    .wrap { width:min(1120px, calc(100% - 18px)); margin:0 auto; }
    h1 { margin:0; font-size:1.45rem; line-height:1.15; }
    .sub { margin-top:3px; color:#dce5f3; font-size:.82rem; font-weight:700; }
    main { padding:10px 0 24px; display:grid; gap:10px; }
    section, .task { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; }
    h2 { margin:0 0 8px; font-size:1rem; line-height:1.2; }
    h3 { margin:0 0 6px; font-size:.9rem; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .triple { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
    .chips, .tools { display:flex; flex-wrap:wrap; gap:7px; }
    button {
      min-height:38px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink);
      padding:6px 10px; font:inherit; font-weight:800; cursor:pointer; letter-spacing:0;
    }
    button[aria-pressed="true"] { background:var(--blue); border-color:var(--blue); color:#fff; }
    button.primary { background:var(--green); border-color:var(--green); color:#fff; }
    button.warn { color:var(--red); }
    label { display:grid; gap:5px; color:var(--muted); font-size:.78rem; font-weight:800; }
    textarea, input {
      width:100%; border:1px solid var(--line); border-radius:7px; padding:8px; color:var(--ink);
      font:inherit; letter-spacing:0; background:#fff;
    }
    textarea { min-height:86px; resize:vertical; }
    .brief { min-height:250px; white-space:pre-wrap; overflow-wrap:anywhere; background:#f9fafb; }
    .status, .hint, .muted { color:var(--muted); font-size:.78rem; }
    .meter { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
    .metric { border:1px solid var(--line); border-radius:8px; padding:8px; background:#f9fafb; }
    .metric strong { display:block; font-size:1.15rem; line-height:1; }
    .metric span { color:var(--muted); font-size:.72rem; }
    .lane-card { border:1px solid var(--line); border-radius:8px; padding:8px; background:#f9fafb; }
    .lane-card p { margin:0; color:var(--muted); font-size:.76rem; }
    .tasks { display:grid; gap:8px; }
    .task { border-left:5px solid var(--green); display:grid; gap:4px; }
    .task strong { font-size:.9rem; overflow-wrap:anywhere; }
    .task p { margin:0; color:var(--muted); font-size:.76rem; white-space:pre-wrap; overflow-wrap:anywhere; }
    @media (max-width:820px) {
      .grid, .triple, .meter { grid-template-columns:1fr; }
      button { min-height:42px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>外部AIブリーフ圧縮器</h1>
      <div class="sub">スマホで選んで、外部AI・Web・CODEXタスクへ渡す</div>
    </div>
  </header>

  <main class="wrap">
    <section>
      <h2>圧縮シグナル</h2>
      <div class="meter">
        <div class="metric"><strong id="selectedCount">0</strong><span>選択済み</span></div>
        <div class="metric"><strong id="charCount">0</strong><span>依頼文の文字数</span></div>
        <div class="metric"><strong id="taskCount">0</strong><span>タスク保存</span></div>
        <div class="metric"><strong>1</strong><span>目的は1つ</span></div>
      </div>
    </section>

    <section>
      <h2>専用レーン</h2>
      <div class="triple" id="laneCards"></div>
      <p class="hint">MVのような複合制作は、音楽、歌詞、画像、動画構成を1つの短い依頼に束ねます。</p>
    </section>

    <section class="grid">
      <div>
        <h2>目的</h2>
        <div class="chips" data-group="purpose">
          <button type="button" data-value="アイデアを出す">アイデア</button>
          <button type="button" data-value="仕様に分解する">仕様化</button>
          <button type="button" data-value="素材を生成する">素材生成</button>
          <button type="button" data-value="実装手順に分解する">実装手順</button>
          <button type="button" data-value="Webで調べる観点を作る">調査観点</button>
        </div>
      </div>
      <div>
        <h2>出力先</h2>
        <div class="chips" data-group="destination">
          <button type="button" data-value="チャット欄へコピペ">チャットへコピー</button>
          <button type="button" data-value="CODEXタスクリストへ追加">CODEXタスク</button>
          <button type="button" data-value="外部AIへ依頼">外部AI</button>
          <button type="button" data-value="Web調査へ渡す">Web調査</button>
        </div>
      </div>
      <div>
        <h2>出力形式</h2>
        <div class="chips" data-group="format">
          <button type="button" data-value="箇条書き5件">5件リスト</button>
          <button type="button" data-value="実装チケット形式">チケット</button>
          <button type="button" data-value="制作レーン表">レーン表</button>
          <button type="button" data-value="そのまま貼れるプロンプト">プロンプト</button>
        </div>
      </div>
      <div>
        <h2>トーン</h2>
        <div class="chips" data-group="tone">
          <button type="button" data-value="短く実務的に">短く実務的</button>
          <button type="button" data-value="やさしい日本語で">やさしい日本語</button>
          <button type="button" data-value="制作スタッフ向けに">制作向け</button>
          <button type="button" data-value="スマホで読める長さで">スマホ向け</button>
        </div>
      </div>
    </section>

    <section>
      <h2>制作要素</h2>
      <div class="chips" data-group="elements" data-multi="true">
        <button type="button" data-value="音楽">音楽</button>
        <button type="button" data-value="歌詞">歌詞</button>
        <button type="button" data-value="画像">画像</button>
        <button type="button" data-value="イラスト">イラスト</button>
        <button type="button" data-value="動画構成">動画構成</button>
        <button type="button" data-value="ゲーム設計">ゲーム</button>
        <button type="button" data-value="アプリUI">アプリUI</button>
        <button type="button" data-value="Web記事">Web記事</button>
      </div>
    </section>

    <section>
      <h2>確認観点</h2>
      <div class="chips" data-group="checks" data-multi="true">
        <button type="button" data-value="前提が不明な点を分ける">不明点</button>
        <button type="button" data-value="実行手順を小さくする">小手順</button>
        <button type="button" data-value="権利や利用範囲に注意する">権利</button>
        <button type="button" data-value="CODEXで実行できる形にする">CODEX実行</button>
        <button type="button" data-value="CG掲載までの確認を書く">CG掲載</button>
      </div>
    </section>

    <section class="grid">
      <label>材料メモ
        <textarea id="source" placeholder="例: 和風Lo-fiのMV。夜の街、短い歌詞、1分動画の構成がほしい"></textarea>
      </label>
      <label>追加条件
        <textarea id="extra" placeholder="例: HOSHIのGPUは使わない。外部AI/Web中心。スマホから渡せる短さ。"></textarea>
      </label>
    </section>

    <section>
      <div class="tools">
        <button class="primary" id="build" type="button">依頼文を作る</button>
        <button id="copy" type="button">コピー</button>
        <button id="addTask" type="button">タスクリストに追加</button>
        <button id="exportJson" type="button">JSON</button>
        <button id="exportMarkdown" type="button">Markdown</button>
        <button class="warn" id="reset" type="button">リセット</button>
      </div>
      <label style="margin-top:8px;">圧縮ブリーフ
        <textarea class="brief" id="brief" readonly></textarea>
      </label>
      <div class="status" id="status" role="status" aria-live="polite">専用レーンを選ぶと、制作要素も自動で入ります。</div>
    </section>

    <section>
      <h2>CODEXタスクリスト</h2>
      <div class="tools">
        <button id="exportTasks" type="button">タスクJSON</button>
        <button id="clearTasks" class="warn" type="button">タスクを消す</button>
      </div>
      <div class="tasks" id="tasks" style="margin-top:8px;"></div>
    </section>
  </main>

  <script>
    const key = "codex.externalAiBriefCompressor.v2";
    const groups = ["lane", "purpose", "destination", "format", "tone", "elements", "checks"];
    const lanePresets = [
      { id:"mv", label:"MV", desc:"音楽+歌詞+画像+動画構成", purpose:"仕様に分解する", format:"制作レーン表", elements:["音楽","歌詞","画像","動画構成"], checks:["権利や利用範囲に注意する","CODEXで実行できる形にする","CG掲載までの確認を書く"] },
      { id:"music", label:"音楽", desc:"曲調、構成、歌詞なし/あり", purpose:"素材を生成する", format:"そのまま貼れるプロンプト", elements:["音楽"], checks:["権利や利用範囲に注意する","実行手順を小さくする"] },
      { id:"lyrics", label:"歌詞", desc:"テーマ、語感、構成", purpose:"アイデアを出す", format:"箇条書き5件", elements:["歌詞"], checks:["前提が不明な点を分ける"] },
      { id:"illustration", label:"イラスト", desc:"構図、画風、差分", purpose:"素材を生成する", format:"そのまま貼れるプロンプト", elements:["イラスト"], checks:["権利や利用範囲に注意する","CG掲載までの確認を書く"] },
      { id:"image", label:"画像", desc:"写真風、バナー、素材", purpose:"素材を生成する", format:"そのまま貼れるプロンプト", elements:["画像"], checks:["権利や利用範囲に注意する"] },
      { id:"game", label:"ゲーム", desc:"ルール、UI、MVP", purpose:"実装手順に分解する", format:"実装チケット形式", elements:["ゲーム設計","アプリUI"], checks:["実行手順を小さくする","CODEXで実行できる形にする"] },
      { id:"app", label:"アプリ", desc:"画面、保存、出力", purpose:"実装手順に分解する", format:"実装チケット形式", elements:["アプリUI"], checks:["CODEXで実行できる形にする","CG掲載までの確認を書く"] },
      { id:"article", label:"Web記事", desc:"調査、構成、要約", purpose:"Webで調べる観点を作る", format:"箇条書き5件", elements:["Web記事"], checks:["前提が不明な点を分ける","権利や利用範囲に注意する"] },
      { id:"research", label:"調査", desc:"URL、要点、判断材料", purpose:"アイデアを出す", format:"制作レーン表", elements:["Web記事"], checks:["前提が不明な点を分ける","実行手順を小さくする"] }
    ];
    const defaults = {
      lane:"mv",
      purpose:"仕様に分解する",
      destination:"チャット欄へコピペ",
      format:"制作レーン表",
      tone:"スマホで読める長さで",
      elements:["音楽","歌詞","画像","動画構成"],
      checks:["権利や利用範囲に注意する","CODEXで実行できる形にする","CG掲載までの確認を書く"],
      source:"",
      extra:"HOSHIのGPU/CPU/NPUの重い処理は使わない。CODEXから外部AI/Webへ渡す前提。",
      brief:"",
      tasks:[]
    };
    let state = load();

    function load() {
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || "null");
        if (parsed) return { ...defaults, ...parsed };
      } catch {}
      return { ...defaults };
    }

    function save() {
      state.source = document.getElementById("source").value;
      state.extra = document.getElementById("extra").value;
      state.brief = document.getElementById("brief").value;
      localStorage.setItem(key, JSON.stringify(state));
      updateMetrics();
    }

    function renderLanes() {
      const box = document.getElementById("laneCards");
      box.innerHTML = lanePresets.map((lane) => `<article class="lane-card"><h3>${escapeHtml(lane.label)}</h3><p>${escapeHtml(lane.desc)}</p><button type="button" data-lane="${lane.id}" aria-pressed="${state.lane === lane.id}">選ぶ</button></article>`).join("");
      box.querySelectorAll("[data-lane]").forEach((button) => button.addEventListener("click", () => selectLane(button.dataset.lane)));
    }

    function selectLane(id) {
      const preset = lanePresets.find((item) => item.id === id);
      if (!preset) return;
      state.lane = preset.id;
      state.purpose = preset.purpose;
      state.format = preset.format;
      state.elements = [...preset.elements];
      state.checks = [...preset.checks];
      renderAll();
      save();
      setStatus(`${preset.label}レーンを選びました。`);
    }

    function selectValue(group, value) {
      const multi = document.querySelector(`[data-group="${group}"]`)?.dataset.multi === "true";
      if (multi) {
        const values = new Set(state[group] || []);
        values.has(value) ? values.delete(value) : values.add(value);
        state[group] = [...values];
      } else {
        state[group] = value;
      }
      renderButtons();
      save();
    }

    function renderButtons() {
      groups.filter((group) => group !== "lane").forEach((group) => {
        document.querySelectorAll(`[data-group="${group}"] button`).forEach((button) => {
          const current = state[group];
          const pressed = Array.isArray(current) ? current.includes(button.dataset.value) : current === button.dataset.value;
          button.setAttribute("aria-pressed", String(pressed));
        });
      });
    }

    function buildBrief() {
      save();
      const lane = lanePresets.find((item) => item.id === state.lane);
      const elements = (state.elements || []).map((item) => `- ${item}`).join("\n");
      const checks = (state.checks || []).map((item) => `- ${item}`).join("\n");
      const text = [
        "あなたは外部AIとして、以下の制作依頼を短く処理してください。",
        "",
        `専用レーン: ${lane ? lane.label : state.lane}`,
        `目的: ${state.purpose}`,
        `出力先: ${state.destination}`,
        `出力形式: ${state.format}`,
        `トーン: ${state.tone}`,
        "",
        "制作要素:",
        elements || "- 未選択",
        "",
        "材料:",
        state.source.trim() || "未入力。必要なら最小限の確認質問を1つだけしてください。",
        "",
        "追加条件:",
        state.extra.trim() || "なし",
        "",
        "確認観点:",
        checks || "- 前提と次アクションを分ける",
        "",
        "制約:",
        "- 長い背景説明は不要。",
        "- 結論、理由、手順、注意点の順で短く返す。",
        "- CODEXで実行する場合は、対象ファイル、受入基準、確認コマンドを分ける。"
      ].join("\n");
      document.getElementById("brief").value = text;
      save();
      setStatus("依頼文を作りました。");
      return text;
    }

    async function copyBrief() {
      if (!document.getElementById("brief").value) buildBrief();
      try {
        await navigator.clipboard.writeText(document.getElementById("brief").value);
        setStatus("コピーしました。チャット欄へ貼れます。");
      } catch {
        setStatus("コピーできませんでした。長押しで選択してください。");
      }
    }

    function addTask() {
      const brief = document.getElementById("brief").value || buildBrief();
      const lane = lanePresets.find((item) => item.id === state.lane);
      state.tasks.unshift({
        id:String(Date.now()),
        lane: lane ? lane.label : state.lane,
        destination: state.destination,
        title: `${lane ? lane.label : "制作"}: ${state.purpose}`,
        brief,
        createdAt:new Date().toISOString()
      });
      save();
      renderTasks();
      setStatus("CODEXタスクリストに追加しました。");
    }

    function payload() {
      save();
      return { name:"外部AIブリーフ圧縮器", ...state, updatedAt:new Date().toISOString() };
    }

    function exportJson() {
      downloadText("external-ai-brief.json", JSON.stringify(payload(), null, 2), "application/json;charset=utf-8");
    }

    function exportMarkdown() {
      const item = payload();
      downloadText("external-ai-brief.md", `# 外部AIブリーフ\n\n${item.brief || buildBrief()}\n`, "text/markdown;charset=utf-8");
    }

    function exportTasks() {
      downloadText("codex-task-list.json", JSON.stringify(state.tasks, null, 2), "application/json;charset=utf-8");
    }

    function clearTasks() {
      state.tasks = [];
      save();
      renderTasks();
      setStatus("タスクリストを消しました。");
    }

    function downloadText(filename, text, type) {
      const blob = new Blob([text], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      setStatus(`${filename} を書き出しました。`);
    }

    function resetAll() {
      state = { ...defaults, elements:[...defaults.elements], checks:[...defaults.checks], tasks:state.tasks || [] };
      applyState();
      save();
      setStatus("選択を初期状態に戻しました。");
    }

    function applyState() {
      document.getElementById("source").value = state.source || "";
      document.getElementById("extra").value = state.extra || "";
      document.getElementById("brief").value = state.brief || "";
      renderAll();
    }

    function renderAll() {
      renderLanes();
      renderButtons();
      renderTasks();
      updateMetrics();
    }

    function renderTasks() {
      const box = document.getElementById("tasks");
      box.innerHTML = state.tasks.length ? state.tasks.map((task) => `<article class="task"><strong>${escapeHtml(task.title)}</strong><p>${escapeHtml(task.destination)} / ${escapeHtml(task.createdAt)}</p><p>${escapeHtml(task.brief.slice(0, 180))}${task.brief.length > 180 ? "..." : ""}</p></article>`).join("") : '<p class="muted">まだタスクはありません。</p>';
    }

    function updateMetrics() {
      const selected = groups.reduce((sum, group) => sum + (Array.isArray(state[group]) ? state[group].length : state[group] ? 1 : 0), 0);
      document.getElementById("selectedCount").textContent = selected;
      document.getElementById("charCount").textContent = document.getElementById("brief").value.length;
      document.getElementById("taskCount").textContent = state.tasks.length;
    }

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[char]));
    }

    document.querySelectorAll("[data-group] button").forEach((button) => {
      button.addEventListener("click", () => selectValue(button.parentElement.dataset.group, button.dataset.value));
    });
    document.getElementById("source").addEventListener("input", save);
    document.getElementById("extra").addEventListener("input", save);
    document.getElementById("build").addEventListener("click", buildBrief);
    document.getElementById("copy").addEventListener("click", copyBrief);
    document.getElementById("addTask").addEventListener("click", addTask);
    document.getElementById("exportJson").addEventListener("click", exportJson);
    document.getElementById("exportMarkdown").addEventListener("click", exportMarkdown);
    document.getElementById("exportTasks").addEventListener("click", exportTasks);
    document.getElementById("clearTasks").addEventListener("click", clearTasks);
    document.getElementById("reset").addEventListener("click", resetAll);
    applyState();
  </script>
</body>
</html>
