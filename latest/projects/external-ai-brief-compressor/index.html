<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>外部AIブリーフ圧縮器</title>
  <style>
    :root {
      --bg:#f4f6f8; --panel:#fff; --ink:#172033; --muted:#667085; --line:#d9dee7;
      --blue:#2563eb; --green:#15803d; --amber:#b45309; --red:#b42318; --violet:#6d28d9;
      font-family:"Segoe UI","Meiryo",system-ui,sans-serif;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); letter-spacing:0; line-height:1.45; }
    header { background:#172033; color:white; padding:14px; border-bottom:4px solid var(--blue); }
    .wrap { width:min(1180px, calc(100% - 18px)); margin:0 auto; }
    h1 { margin:0; font-size:1.45rem; line-height:1.15; }
    .sub { margin-top:3px; color:#dce5f3; font-size:.82rem; font-weight:700; }
    main { padding:10px 0 24px; display:grid; gap:10px; }
    section, .task, .lane-card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; }
    h2 { margin:0 0 8px; font-size:1rem; line-height:1.2; }
    h3 { margin:0 0 6px; font-size:.9rem; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .triple { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .quad { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; }
    .chips, .tools { display:flex; flex-wrap:wrap; gap:7px; }
    button {
      min-height:38px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink);
      padding:6px 10px; font:inherit; font-weight:800; cursor:pointer; letter-spacing:0;
    }
    button[aria-pressed="true"] { background:var(--blue); border-color:var(--blue); color:#fff; }
    button.primary { background:var(--green); border-color:var(--green); color:#fff; }
    button.go { background:var(--violet); border-color:var(--violet); color:#fff; }
    button.warn { color:var(--red); }
    label { display:grid; gap:5px; color:var(--muted); font-size:.78rem; font-weight:800; }
    textarea, input {
      width:100%; border:1px solid var(--line); border-radius:7px; padding:8px; color:var(--ink);
      font:inherit; letter-spacing:0; background:#fff;
    }
    textarea { min-height:78px; resize:vertical; }
    .brief { min-height:260px; white-space:pre-wrap; overflow-wrap:anywhere; background:#f9fafb; }
    .status, .hint, .muted { color:var(--muted); font-size:.78rem; }
    .metric { border:1px solid var(--line); border-radius:8px; padding:8px; background:#f9fafb; min-width:0; }
    .metric strong { display:block; font-size:1.18rem; line-height:1; overflow-wrap:anywhere; }
    .metric span { color:var(--muted); font-size:.72rem; }
    .lane-card { background:#f9fafb; display:grid; gap:6px; align-content:start; }
    .lane-card p { margin:0; color:var(--muted); font-size:.76rem; }
    .tasks { display:grid; gap:8px; }
    .task { border-left:5px solid var(--amber); display:grid; gap:5px; }
    .task.ready { border-left-color:var(--green); }
    .task.go { border-left-color:var(--violet); }
    .task strong { font-size:.9rem; overflow-wrap:anywhere; }
    .task p { margin:0; color:var(--muted); font-size:.76rem; white-space:pre-wrap; overflow-wrap:anywhere; }
    .pill { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:3px 7px; font-size:.7rem; font-weight:800; background:#fff; }
    @media (max-width:860px) {
      .grid, .triple, .quad { grid-template-columns:1fr; }
      button { min-height:42px; }
      .wrap { width:min(100% - 14px, 460px); }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>外部AIブリーフ圧縮器</h1>
      <div class="sub">選ぶ、曖昧さを消す、超概算を見る、GO前タスクにセットする</div>
    </div>
  </header>

  <main class="wrap">
    <section>
      <h2>管制メーター</h2>
      <div class="quad">
        <div class="metric"><strong id="ambiguityScore">0</strong><span>曖昧さ</span></div>
        <div class="metric"><strong id="tokenEstimate">0</strong><span>超概算トークン</span></div>
        <div class="metric"><strong id="readiness">未設定</strong><span>GO判定</span></div>
        <div class="metric"><strong id="taskCount">0</strong><span>セット済み</span></div>
      </div>
      <p class="hint">トークン量は文字数と選択内容からの粗い目安です。正確な請求量ではありません。</p>
    </section>

    <section>
      <h2>専用レーン</h2>
      <div class="triple" id="laneCards"></div>
    </section>

    <section class="grid">
      <div>
        <h2>目的</h2>
        <div class="chips" data-group="purpose">
          <button type="button" data-value="アイデアを出す">アイデア</button>
          <button type="button" data-value="仕様に分解する">仕様化</button>
          <button type="button" data-value="素材を生成する">素材生成</button>
          <button type="button" data-value="実装する">実装</button>
          <button type="button" data-value="Webで調べる">Web調査</button>
        </div>
      </div>
      <div>
        <h2>出力先</h2>
        <div class="chips" data-group="destination">
          <button type="button" data-value="チャット欄へコピペ">チャットへコピー</button>
          <button type="button" data-value="CODEXタスクとしてセット">CODEXタスク</button>
          <button type="button" data-value="外部AIへ依頼">外部AI</button>
          <button type="button" data-value="Web調査へ渡す">Web調査</button>
        </div>
      </div>
      <div>
        <h2>作り込み</h2>
        <div class="chips" data-group="depth">
          <button type="button" data-value="MVP">MVP</button>
          <button type="button" data-value="標準">標準</button>
          <button type="button" data-value="作り込み">作り込み</button>
          <button type="button" data-value="徹底作り込み">徹底作り込み</button>
        </div>
      </div>
      <div>
        <h2>実行主体</h2>
        <div class="chips" data-group="executor">
          <button type="button" data-value="CODEXで静的成果物を作る">CODEX</button>
          <button type="button" data-value="外部AIで素材案を作る">外部AI</button>
          <button type="button" data-value="Webで材料を確認する">Web</button>
          <button type="button" data-value="HOSHI確認待ち">HOSHI確認</button>
        </div>
      </div>
    </section>

    <section>
      <h2>制作要素</h2>
      <div class="chips" data-group="elements" data-multi="true">
        <button type="button" data-value="音楽">音楽</button>
        <button type="button" data-value="歌詞">歌詞</button>
        <button type="button" data-value="画像">画像</button>
        <button type="button" data-value="イラスト">イラスト</button>
        <button type="button" data-value="動画構成">動画構成</button>
        <button type="button" data-value="ゲーム設計">ゲーム</button>
        <button type="button" data-value="アプリUI">アプリUI</button>
        <button type="button" data-value="Web記事">Web記事</button>
        <button type="button" data-value="データ設計">データ</button>
        <button type="button" data-value="検証手順">検証</button>
      </div>
    </section>

    <section class="grid">
      <label>成果物名
        <input id="title" placeholder="例: MV Brief Kit">
      </label>
      <label>対象ユーザー
        <input id="audience" placeholder="例: スマホからCG制作を指示するHOSHI">
      </label>
      <label>材料メモ
        <textarea id="source" placeholder="例: 和風Lo-fiのMV。夜の街、短い歌詞、1分動画の構成がほしい"></textarea>
      </label>
      <label>禁止/制約
        <textarea id="constraints" placeholder="例: HOSHIのGPU/CPU/NPUは使わない。権利が絡む固有名詞は避ける。"></textarea>
      </label>
      <label>受入基準
        <textarea id="acceptance" placeholder="例: 単一HTML。スマホで選択式。JSON/Markdown/コピー。CG掲載。"></textarea>
      </label>
      <label>確認コマンド/確認観点
        <textarea id="checks" placeholder="例: JS構文、JSON台帳、CGリンク、CSD生成、Drive同期。"></textarea>
      </label>
    </section>

    <section>
      <div class="tools">
        <button class="primary" id="build" type="button">詳細仕様を作る</button>
        <button id="copy" type="button">チャット用コピー</button>
        <button id="setTask" type="button">セット完了</button>
        <button class="go" id="approveTask" type="button">GOサイン</button>
        <button id="exportJson" type="button">JSON</button>
        <button id="exportMarkdown" type="button">Markdown</button>
        <button class="warn" id="reset" type="button">リセット</button>
      </div>
      <label style="margin-top:8px;">CODEX実行前ブリーフ
        <textarea class="brief" id="brief" readonly></textarea>
      </label>
      <div class="status" id="status" role="status" aria-live="polite">成果物名、材料、受入基準が入るとGO判定が上がります。</div>
    </section>

    <section>
      <h2>セット済みタスク</h2>
      <div class="tools">
        <button id="exportTasks" type="button">タスクJSON</button>
        <button class="warn" id="clearTasks" type="button">タスクを消す</button>
      </div>
      <div class="tasks" id="tasks" style="margin-top:8px;"></div>
    </section>
  </main>

  <script>
    const key = "codex.externalAiBriefCompressor.v3";
    const groups = ["lane","purpose","destination","depth","executor","elements"];
    const lanePresets = [
      { id:"mv", label:"MV", desc:"音楽+歌詞+画像+動画構成", elements:["音楽","歌詞","画像","動画構成"], acceptance:"MV制作ブリーフ一式を生成できる。音楽AI用、画像AI用、動画AI用、CODEX掲載用を分ける。" },
      { id:"music", label:"音楽", desc:"曲調、BPM、構成、歌の有無", elements:["音楽"], acceptance:"曲調、構成、歌詞有無、外部AI用プロンプトを出せる。" },
      { id:"lyrics", label:"歌詞", desc:"テーマ、語感、構成", elements:["歌詞"], acceptance:"短いオリジナル歌詞案と修正観点を出せる。" },
      { id:"image", label:"画像", desc:"写真風、バナー、素材", elements:["画像"], acceptance:"画像生成用の安全な構図、画風、用途、差分指示を出せる。" },
      { id:"illustration", label:"イラスト", desc:"キャラ、背景、差分", elements:["イラスト"], acceptance:"イラスト用プロンプト、構図、差分、権利注意を出せる。" },
      { id:"video", label:"動画", desc:"尺、場面、カット、字幕", elements:["動画構成","画像"], acceptance:"秒単位の構成、必要素材、確認観点を出せる。" },
      { id:"game", label:"ゲーム", desc:"ルール、UI、MVP、保存", elements:["ゲーム設計","アプリUI","検証手順"], acceptance:"単一HTMLゲームとして実装できる仕様、操作、勝敗、保存、出力を定義する。" },
      { id:"app", label:"アプリ", desc:"画面、保存、出力、CG掲載", elements:["アプリUI","データ設計","検証手順"], acceptance:"単一HTMLアプリとして目的、画面、保存、JSON/Markdown出力、検証を定義する。" },
      { id:"article", label:"Web記事", desc:"調査、構成、要約", elements:["Web記事","検証手順"], acceptance:"URL、要点、判断、引用しすぎ防止、次アクションを分ける。" },
      { id:"research", label:"調査", desc:"Web材料、比較、判断", elements:["Web記事","データ設計"], acceptance:"調査観点、信頼できる一次情報、比較表、使う/使わない判断を出せる。" }
    ];
    const defaults = {
      lane:"mv",
      purpose:"仕様に分解する",
      destination:"CODEXタスクとしてセット",
      depth:"標準",
      executor:"CODEXで静的成果物を作る",
      elements:["音楽","歌詞","画像","動画構成"],
      title:"",
      audience:"",
      source:"",
      constraints:"HOSHIのGPU/CPU/NPUの重い処理は使わない。CODEXから外部AI/Webへ渡す前提。",
      acceptance:"単一HTML。スマホで選択式。JSON/Markdown/コピー。CG掲載。",
      checks:"JS構文、JSON台帳、CGリンク、CSD生成、Drive同期。",
      brief:"",
      tasks:[]
    };
    let state = load();

    function load() {
      try {
        const parsed = JSON.parse(localStorage.getItem(key) || "null");
        if (parsed) return { ...defaults, ...parsed };
      } catch {}
      return { ...defaults };
    }

    function save() {
      ["title","audience","source","constraints","acceptance","checks","brief"].forEach((id) => {
        state[id] = document.getElementById(id).value;
      });
      localStorage.setItem(key, JSON.stringify(state));
      updateMeters();
    }

    function selectLane(id) {
      const preset = lanePresets.find((item) => item.id === id);
      if (!preset) return;
      state.lane = preset.id;
      state.elements = [...preset.elements];
      if (!document.getElementById("acceptance").value.trim()) {
        state.acceptance = preset.acceptance;
      }
      renderAll();
      applyFields();
      save();
      setStatus(`${preset.label}レーンを選びました。`);
    }

    function selectValue(group, value) {
      const multi = document.querySelector(`[data-group="${group}"]`)?.dataset.multi === "true";
      if (multi) {
        const values = new Set(state[group] || []);
        values.has(value) ? values.delete(value) : values.add(value);
        state[group] = [...values];
      } else {
        state[group] = value;
      }
      renderButtons();
      save();
    }

    function ambiguity() {
      const required = ["title","source","acceptance","checks"];
      const missing = required.filter((id) => !String(state[id] || "").trim());
      const weak = [];
      if ((state.elements || []).length === 0) weak.push("制作要素");
      if (!state.executor) weak.push("実行主体");
      if (!state.destination) weak.push("出力先");
      return { score: missing.length + weak.length, missing:[...missing, ...weak] };
    }

    function estimateTokens() {
      const text = [state.title,state.audience,state.source,state.constraints,state.acceptance,state.checks,state.brief].join("\n");
      const base = Math.ceil(text.length / 2.2);
      const laneCost = { MVP:500, "標準":900, "作り込み":1500, "徹底作り込み":2400 }[state.depth] || 900;
      const elementCost = (state.elements || []).length * 180;
      return Math.max(500, base + laneCost + elementCost);
    }

    function readinessLabel() {
      const score = ambiguity().score;
      if (score === 0) return "GO可";
      if (score <= 2) return "要確認";
      return "未整理";
    }

    function buildBrief() {
      save();
      const lane = lanePresets.find((item) => item.id === state.lane);
      const missing = ambiguity().missing;
      const text = [
        "CODEX実行前ブリーフ",
        "",
        `成果物名: ${state.title || "未設定"}`,
        `専用レーン: ${lane ? lane.label : state.lane}`,
        `目的: ${state.purpose}`,
        `出力先: ${state.destination}`,
        `作り込み: ${state.depth}`,
        `実行主体: ${state.executor}`,
        `対象ユーザー: ${state.audience || "未設定"}`,
        `超概算トークン: ${estimateTokens()} tokens前後`,
        `GO判定: ${readinessLabel()}`,
        "",
        "制作要素:",
        (state.elements || []).map((item) => `- ${item}`).join("\n") || "- 未選択",
        "",
        "材料:",
        state.source.trim() || "未入力",
        "",
        "禁止/制約:",
        state.constraints.trim() || "なし",
        "",
        "受入基準:",
        state.acceptance.trim() || "未設定",
        "",
        "確認:",
        state.checks.trim() || "未設定",
        "",
        "曖昧さ:",
        missing.length ? missing.map((item) => `- ${item}`).join("\n") : "- なし",
        "",
        "CODEXで実行する場合:",
        "- まず対象ファイルを限定する。",
        "- 単一HTML、CG掲載、CSD/台帳同期を優先する。",
        "- HOSHIのGPU/CPU/NPUの重い処理は使わない。",
        "- 作成後にJS構文、JSON台帳、CGリンク、Drive同期を確認する。"
      ].join("\n");
      document.getElementById("brief").value = text;
      save();
      setStatus("詳細仕様を作りました。");
      return text;
    }

    async function copyBrief() {
      if (!document.getElementById("brief").value) buildBrief();
      try {
        await navigator.clipboard.writeText(document.getElementById("brief").value);
        setStatus("コピーしました。チャット欄へ貼れます。");
      } catch {
        setStatus("コピーできませんでした。長押しで選択してください。");
      }
    }

    function setTask(status) {
      const brief = document.getElementById("brief").value || buildBrief();
      const lane = lanePresets.find((item) => item.id === state.lane);
      const item = {
        id:String(Date.now()),
        status,
        title: state.title || `${lane ? lane.label : "制作"}タスク`,
        lane: lane ? lane.label : state.lane,
        destination: state.destination,
        readiness: readinessLabel(),
        ambiguity: ambiguity(),
        estimatedTokens: estimateTokens(),
        brief,
        createdAt:new Date().toISOString()
      };
      state.tasks.unshift(item);
      save();
      renderTasks();
      setStatus(status === "go" ? "GOサイン済みタスクにしました。" : "タスクをセットしました。");
    }

    function payload() {
      save();
      return { name:"外部AIブリーフ圧縮器", ...state, ambiguity:ambiguity(), estimatedTokens:estimateTokens(), updatedAt:new Date().toISOString() };
    }

    function exportJson() {
      downloadText("external-ai-brief.json", JSON.stringify(payload(), null, 2), "application/json;charset=utf-8");
    }

    function exportMarkdown() {
      const item = payload();
      downloadText("external-ai-brief.md", `# 外部AIブリーフ\n\n${item.brief || buildBrief()}\n`, "text/markdown;charset=utf-8");
    }

    function exportTasks() {
      downloadText("codex-task-list.json", JSON.stringify(state.tasks, null, 2), "application/json;charset=utf-8");
    }

    function clearTasks() {
      state.tasks = [];
      save();
      renderTasks();
      setStatus("タスクを消しました。");
    }

    function downloadText(filename, text, type) {
      const blob = new Blob([text], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      setStatus(`${filename} を書き出しました。`);
    }

    function resetAll() {
      state = { ...defaults, elements:[...defaults.elements], tasks:state.tasks || [] };
      applyFields();
      renderAll();
      save();
      setStatus("入力を初期化しました。");
    }

    function applyFields() {
      ["title","audience","source","constraints","acceptance","checks","brief"].forEach((id) => {
        document.getElementById(id).value = state[id] || "";
      });
    }

    function renderLanes() {
      const box = document.getElementById("laneCards");
      box.innerHTML = lanePresets.map((lane) => `<article class="lane-card"><h3>${escapeHtml(lane.label)}</h3><p>${escapeHtml(lane.desc)}</p><button type="button" data-lane="${lane.id}" aria-pressed="${state.lane === lane.id}">選ぶ</button><span class="pill">${escapeHtml(lane.elements.join(" / "))}</span></article>`).join("");
      box.querySelectorAll("[data-lane]").forEach((button) => button.addEventListener("click", () => selectLane(button.dataset.lane)));
    }

    function renderButtons() {
      groups.filter((group) => group !== "lane").forEach((group) => {
        document.querySelectorAll(`[data-group="${group}"] button`).forEach((button) => {
          const current = state[group];
          const pressed = Array.isArray(current) ? current.includes(button.dataset.value) : current === button.dataset.value;
          button.setAttribute("aria-pressed", String(pressed));
        });
      });
    }

    function renderTasks() {
      const box = document.getElementById("tasks");
      box.innerHTML = state.tasks.length ? state.tasks.map((task) => `<article class="task ${task.status === "go" ? "go" : task.readiness === "GO可" ? "ready" : ""}"><strong>${escapeHtml(task.title)}</strong><p>${escapeHtml(task.status === "go" ? "GOサイン済み" : "セット済み")} / ${escapeHtml(task.lane)} / ${escapeHtml(task.readiness)} / 約${escapeHtml(task.estimatedTokens)} tokens</p><p>${escapeHtml(task.brief.slice(0, 220))}${task.brief.length > 220 ? "..." : ""}</p></article>`).join("") : '<p class="muted">まだタスクはありません。</p>';
    }

    function updateMeters() {
      const amb = ambiguity();
      document.getElementById("ambiguityScore").textContent = amb.score;
      document.getElementById("tokenEstimate").textContent = estimateTokens();
      document.getElementById("readiness").textContent = readinessLabel();
      document.getElementById("taskCount").textContent = state.tasks.length;
    }

    function renderAll() {
      renderLanes();
      renderButtons();
      renderTasks();
      updateMeters();
    }

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[char]));
    }

    document.querySelectorAll("[data-group] button").forEach((button) => {
      button.addEventListener("click", () => selectValue(button.parentElement.dataset.group, button.dataset.value));
    });
    ["title","audience","source","constraints","acceptance","checks"].forEach((id) => document.getElementById(id).addEventListener("input", save));
    document.getElementById("build").addEventListener("click", buildBrief);
    document.getElementById("copy").addEventListener("click", copyBrief);
    document.getElementById("setTask").addEventListener("click", () => setTask("set"));
    document.getElementById("approveTask").addEventListener("click", () => setTask("go"));
    document.getElementById("exportJson").addEventListener("click", exportJson);
    document.getElementById("exportMarkdown").addEventListener("click", exportMarkdown);
    document.getElementById("exportTasks").addEventListener("click", exportTasks);
    document.getElementById("clearTasks").addEventListener("click", clearTasks);
    document.getElementById("reset").addEventListener("click", resetAll);
    applyFields();
    renderAll();
  </script>
</body>
</html>
