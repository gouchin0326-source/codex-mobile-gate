<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SNS動向 | CODEXGATE</title>
  <style>
    :root{--bg:#f4f6f8;--panel:#fff;--ink:#172033;--muted:#667085;--line:#d9dee7;--blue:#2563eb;--green:#15803d;--amber:#b45309;--rose:#b4235a;font-family:"Segoe UI","Meiryo",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.4}.wrap{width:min(920px,calc(100% - 18px));margin:auto}header{background:#172033;color:#fff;padding:12px 0;border-bottom:4px solid var(--blue)}h1{margin:0;font-size:1.55rem}.sub{margin:3px 0 0;color:#dce5f3;font-size:.86rem;font-weight:900}main{display:grid;gap:8px;padding:8px 0 22px}section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}h2{font-size:1rem;margin:0 0 6px}.metrics,.words{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.metric,.word{border:1px solid var(--line);border-radius:8px;background:#f9fafb;padding:8px;font-weight:900}.metric b,.word b{display:block;font-size:1.22rem;line-height:1.1}.metric span,.word span{display:block;color:var(--muted);font-size:.76rem;margin-top:3px}.feed{display:grid;gap:6px}.item{display:grid;grid-template-columns:54px 1fr;gap:8px;border:1px solid var(--line);border-radius:8px;background:#f9fafb;padding:8px;color:var(--ink);text-decoration:none}.item b{display:grid;place-items:center;min-height:42px;border-radius:8px;background:#172033;color:#fff;font-size:.75rem}.item span{font-size:.95rem;font-weight:900;line-height:1.28;overflow-wrap:anywhere}.item small{display:block;color:var(--muted);font-size:.74rem;font-weight:800;margin-top:3px}.err{border-left:5px solid var(--amber)}.meta{color:var(--muted);font-size:.82rem;font-weight:800}.back{display:inline-grid;place-items:center;min-height:40px;padding:8px 12px;border-radius:8px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900}@media(max-width:560px){.metrics,.words{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.metric,.word{padding:6px}.metric b,.word b{font-size:1rem}.metric span,.word span{font-size:.66rem}.item{grid-template-columns:46px 1fr;padding:7px}.item b{min-height:38px}}
  </style>
</head>
<body>
  <header><div class="wrap"><h1>SNS動向</h1><p class="sub">日本語優先 / Mastodon + Reddit RSS / 10分更新</p></div></header>
  <main class="wrap">
    <section><h2>概要</h2><div class="metrics" id="metrics"><div class="metric"><b>読込</b><span>SNS</span></div></div><p class="meta" id="meta">公開API/RSSのみ。URL掲載OK、本文は短縮。</p></section>
    <section><h2>急上昇語</h2><div class="words" id="words"></div></section>
    <section><h2>投稿</h2><div class="feed" id="feed"></div></section>
    <section><h2>取得エラー</h2><div class="feed" id="errors"><div class="item err"><b>待</b><span>確認中</span></div></div></section>
    <a class="back" href="../index.html">CGへ戻る</a>
  </main>
  <script>
    fetch("../data/social-trends.json?v="+Date.now()).then(r=>r.ok?r.json():null).then(data=>{
      if(!data)return;
      const pc=data.platformCounts||{}, rg=data.region||{};
      document.querySelector("#metrics").innerHTML=`<div class="metric"><b>${rg.japaneseCount||0}</b><span>日本語優先</span></div><div class="metric"><b>${rg.overseasCount||0}</b><span>海外</span></div>`+Object.keys(pc).slice(0,1).map(k=>`<div class="metric"><b>${pc[k]}</b><span>${k}</span></div>`).join("");
      document.querySelector("#meta").textContent=`更新 ${data.updatedAt} / ${data.cadence} / ${data.policy}`;
      document.querySelector("#words").innerHTML=(data.trends||[]).slice(0,9).map(x=>`<div class="word"><b>${x.word}</b><span>${x.count}件</span></div>`).join("");
      document.querySelector("#feed").innerHTML=(data.items||[]).slice(0,24).map(x=>`<a class="item" href="${x.url||'../data/social-trends.json'}"><b>${x.region==='日本語優先'?'日':(x.platform||'SNS')}</b><span>${x.title||'無題'}<small>${x.label||''} / ${x.region||''} / URL保持</small></span></a>`).join("");
      document.querySelector("#errors").innerHTML=(data.errors||[]).length?(data.errors||[]).map(x=>`<div class="item err"><b>${x.platform||'ERR'}</b><span>${x.source}: ${x.error}</span></div>`).join(""):'<div class="item"><b>OK</b><span>取得エラーなし</span></div>';
    }).catch(()=>{});
  </script>
</body>
</html>
