<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日本語話題 | CODEXGATE</title>
  <style>
    :root{--bg:#f4f6f8;--panel:#fff;--ink:#172033;--muted:#667085;--line:#d9dee7;--blue:#2563eb;--green:#15803d;--amber:#b45309;--rose:#b4235a;font-family:"Segoe UI","Meiryo",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.4}.wrap{width:min(920px,calc(100% - 18px));margin:auto}header{background:#172033;color:#fff;padding:12px 0;border-bottom:4px solid var(--blue)}h1{margin:0;font-size:1.55rem}.sub{margin:3px 0 0;color:#dce5f3;font-size:.86rem;font-weight:900}main{display:grid;gap:8px;padding:8px 0 22px}section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}h2{font-size:1rem;margin:0 0 6px}.filters{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px}.filter{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);min-height:34px;padding:5px 10px;font-weight:900;white-space:nowrap}.filter.on{background:var(--blue);color:#fff;border-color:var(--blue)}.metrics,.words{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.metric,.word{border:1px solid var(--line);border-radius:8px;background:#f9fafb;padding:8px;font-weight:900}.metric b,.word b{display:block;font-size:1.22rem;line-height:1.1}.metric span,.word span{display:block;color:var(--muted);font-size:.76rem;margin-top:3px}.topics,.feed{display:grid;gap:6px}.topic,.item{display:grid;grid-template-columns:54px 1fr;gap:8px;border:1px solid var(--line);border-radius:8px;background:#f9fafb;padding:8px;color:var(--ink);text-decoration:none}.topic b,.item b{display:grid;place-items:center;min-height:42px;border-radius:8px;background:#172033;color:#fff;font-size:.75rem}.topic span,.item span{font-size:.95rem;font-weight:900;line-height:1.28;overflow-wrap:anywhere}.topic small,.item small{display:block;color:var(--muted);font-size:.74rem;font-weight:800;margin-top:3px}.topic a{color:var(--blue);font-weight:900;text-decoration:none}.err{border-left:5px solid var(--amber)}.meta{color:var(--muted);font-size:.82rem;font-weight:800}.back{display:inline-grid;place-items:center;min-height:40px;padding:8px 12px;border-radius:8px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900}@media(max-width:560px){.metrics,.words{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.metric,.word{padding:6px}.metric b,.word b{font-size:1rem}.metric span,.word span{font-size:.66rem}.topic,.item{grid-template-columns:46px 1fr;padding:7px}.topic b,.item b{min-height:38px}}
  </style>
</head>
<body>
  <header><div class="wrap"><h1>日本語話題</h1><p class="sub">日本語のみ / ニュースRSS + Mastodon / 10分更新</p></div></header>
  <main class="wrap">
    <section><h2>概要</h2><div class="metrics" id="metrics"><div class="metric"><b>読込</b><span>話題</span></div></div><p class="meta" id="meta">公開API/RSSのみ。URL掲載OK、本文は短縮。</p></section>
    <section><h2>ジャンル</h2><div class="filters" id="filters"></div></section>
    <section><h2>注目トピック</h2><div class="topics" id="topics"></div></section>
    <section><h2>急上昇語</h2><div class="words" id="words"></div></section>
    <section><h2>元URL</h2><div class="feed" id="feed"></div></section>
    <section><h2>取得エラー</h2><div class="feed" id="errors"><div class="item err"><b>待</b><span>確認中</span></div></div></section>
    <a class="back" href="../index.html">CGへ戻る</a>
  </main>
  <script>
    fetch("../data/social-trends.json?v="+Date.now()).then(r=>r.ok?r.json():null).then(data=>{
      if(!data)return;
      const pc=data.platformCounts||{}, rg=data.region||{};
      let active="全部";
      const render=()=>{
        const topics=(data.topics||[]).filter(x=>active==="全部"||x.topic===active);
        const items=(data.items||[]).filter(x=>active==="全部"||x.topic===active);
        document.querySelector("#topics").innerHTML=topics.slice(0,10).map(x=>`<div class="topic"><b>${x.topic}</b><span>${x.headline||'話題なし'}<small>${x.count}件 / 注目${x.attention} / ${(x.urls||[]).map(u=>`<a href="${u.url}">${u.platform}</a>`).join(' ')}</small></span></div>`).join("");
        document.querySelector("#feed").innerHTML=items.slice(0,24).map(x=>`<a class="item" href="${x.url||'../data/social-trends.json'}"><b>${x.topic||'話'}</b><span>${x.title||'無題'}<small>${x.label||''} / URL保持</small></span></a>`).join("");
      };
      document.querySelector("#metrics").innerHTML=`<div class="metric"><b>${rg.japaneseCount||0}</b><span>日本語</span></div><div class="metric"><b>${(data.topics||[]).length}</b><span>ジャンル</span></div>`+Object.keys(pc).slice(0,1).map(k=>`<div class="metric"><b>${pc[k]}</b><span>${k}</span></div>`).join("");
      document.querySelector("#meta").textContent=`更新 ${data.updatedAt} / ${data.cadence} / ${data.policy}`;
      const labels=["全部",...(data.topics||[]).map(x=>x.topic)];
      document.querySelector("#filters").innerHTML=labels.map(x=>`<button class="filter ${x===active?'on':''}" type="button" data-filter="${x}">${x}</button>`).join("");
      document.querySelector("#filters").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;active=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("on",x.dataset.filter===active));render();});
      document.querySelector("#words").innerHTML=(data.trends||[]).slice(0,9).map(x=>`<div class="word"><b>${x.word}</b><span>${x.count}件</span></div>`).join("");
      document.querySelector("#errors").innerHTML=(data.errors||[]).length?(data.errors||[]).map(x=>`<div class="item err"><b>${x.platform||'ERR'}</b><span>${x.source}: ${x.error}</span></div>`).join(""):'<div class="item"><b>OK</b><span>取得エラーなし</span></div>';
      render();
    }).catch(()=>{});
  </script>
</body>
</html>
