<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天気予報 | CODEXGATE</title>
  <style>
    :root{--bg:#f4f6f8;--panel:#fff;--ink:#172033;--muted:#667085;--line:#d9dee7;--blue:#2563eb;--green:#15803d;font-family:"Segoe UI","Meiryo",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.45}.wrap{width:min(920px,calc(100% - 18px));margin:auto}header{background:#172033;color:white;padding:12px 0;border-bottom:4px solid var(--green)}h1{margin:0;font-size:1.6rem}.sub{margin:4px 0 0;color:#dce5f3;font-weight:900;font-size:.9rem}main{display:grid;gap:8px;padding:8px 0 22px}section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}h2{font-size:1.02rem;margin:0 0 6px}.now{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.box{min-width:0;border:1px solid var(--line);border-radius:8px;background:#f9fafb;padding:8px}.box b{display:block;font-size:1.2rem;line-height:1.15;overflow-wrap:anywhere}.box span{color:var(--muted);font-size:.8rem;font-weight:800}.risk{border-color:#f59e0b;background:#fff7ed}.risk.warn{border-color:#b4235a;background:#fff1f2}.weather-art{font-size:2rem;line-height:1}.chart{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:#f9fafb}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:.8rem;font-weight:900}.legend b{display:inline-block;width:10px;height:10px;border-radius:999px;margin-right:4px}.t{background:#b4235a}.r{background:#2563eb}.h{background:#15803d}.bars{display:grid;gap:6px}.bar{display:grid;grid-template-columns:54px 1fr 54px;gap:7px;align-items:center;font-size:.88rem;font-weight:900}.track{height:16px;border-radius:8px;background:#e5e7eb;overflow:hidden}.fill{height:100%;background:var(--blue)}.list{display:grid;gap:6px}.row{display:grid;grid-template-columns:70px repeat(5,1fr);gap:5px;align-items:center;border:1px solid var(--line);border-radius:8px;background:#f9fafb;padding:7px;font-size:.88rem;font-weight:900}.row span{min-width:0;overflow-wrap:anywhere}.radar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.radar a{display:inline-grid;place-items:center;min-height:38px;padding:7px 10px;border-radius:8px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900}.meta{color:var(--muted);font-size:.84rem;font-weight:800}.back{display:inline-grid;place-items:center;min-height:40px;padding:8px 12px;border-radius:8px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900}@media(max-width:560px){.now{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.box{padding:7px}.box b{font-size:1.02rem}.weather-art{font-size:1.7rem}.row{grid-template-columns:52px repeat(3,minmax(0,1fr));font-size:.78rem}.row span:nth-child(n+5){display:none}.bar{grid-template-columns:48px minmax(0,1fr) 46px}.radar{grid-template-columns:1fr}.legend{font-size:.72rem}}
  </style>
</head>
<body>
  <header><div class="wrap"><h1>天気予報</h1><p class="sub">富山県 / Open-Meteo + 気象庁一次データ / Codex 0%運用</p></div></header>
  <main class="wrap">
    <section><h2>警戒</h2><div class="box risk" id="risk"><b>読込中</b><span>富山県</span></div></section>
    <section><h2>現在</h2><div class="now" id="now"><div class="box"><b>読込中</b><span>富山</span></div></div><p class="meta" id="meta">スクレイピングなし</p></section>
    <section><h2>24時間グラフ</h2><div id="chart"></div><div class="legend"><span><b class="t"></b>気温</span><span><b class="r"></b>降水確率</span><span><b class="h"></b>湿度</span></div></section>
    <section><h2>雨雲</h2><div class="radar"><p class="meta">公式ナウキャストで雨雲/雷/竜巻を確認。CG内タイル統合は次段階。</p><a href="https://www.jma.go.jp/bosai/nowc/" target="_blank" rel="noreferrer">気象庁</a></div></section>
    <section><h2>雨バー</h2><div class="bars" id="bars"></div></section>
    <section><h2>24時間</h2><div class="list" id="hourly"></div></section>
    <section><h2>7日</h2><div class="list" id="daily"></div></section>
    <a class="back" href="../index.html">CGへ戻る</a>
  </main>
  <script>
    fetch("../data/weather-info.json?v="+Date.now()).then(r=>r.ok?r.json():null).then(data=>{
      const loc=(data&&data.locations&&data.locations[0])||null; if(!loc)return;
      const c=loc.current||{};
      const risk=data.risk||{};
      const icon=(code)=> code>=80?"☔":code>=61?"🌧":code>=51?"🌦":code>=45?"🌫":code>=3?"☁":"☀";
      document.querySelector("#risk").className=`box risk ${risk.level==='warning'?'warn':''}`;
      document.querySelector("#risk").innerHTML=`<b>${risk.label||"通常"}</b><span>${(risk.lines||[]).join(" / ")}</span>`;
      document.querySelector("#meta").textContent=`更新 ${data.updatedAt} / ${data.mode} / ${data.codexTokenUse}`;
      document.querySelector("#now").innerHTML=`<div class="box"><b class="weather-art">${icon(c.weather_code)}</b><span>天気</span></div><div class="box"><b>${c.temperature_2m??"-"}℃</b><span>気温</span></div><div class="box"><b>${c.apparent_temperature??"-"}℃</b><span>体感</span></div><div class="box"><b>${c.relative_humidity_2m??"-"}%</b><span>湿度</span></div><div class="box"><b>${c.precipitation??"-"}mm</b><span>雨</span></div><div class="box"><b>${c.wind_speed_10m??"-"}km/h</b><span>風</span></div>`;
      const points=(loc.hourly||[]).slice(0,24);
      const path=(rows,key,min,max)=>rows.map((x,i)=>`${i?'L':'M'}${24+i*(352/Math.max(1,rows.length-1))},${132-((Number(x[key])||0)-min)/(max-min||1)*104}`).join(" ");
      const temps=points.map(x=>Number(x.temp)).filter(Number.isFinite), tMin=Math.floor(Math.min(...temps)-1), tMax=Math.ceil(Math.max(...temps)+1);
      document.querySelector("#chart").innerHTML=`<svg class="chart" viewBox="0 0 400 150" role="img" aria-label="24時間の気温、降水確率、湿度"><line x1="24" y1="132" x2="376" y2="132" stroke="#d9dee7"/><line x1="24" y1="28" x2="376" y2="28" stroke="#d9dee7"/><path d="${path(points,'rainProb',0,100)}" fill="none" stroke="#2563eb" stroke-width="3"/><path d="${path(points,'humidity',0,100)}" fill="none" stroke="#15803d" stroke-width="3"/><path d="${path(points,'temp',tMin,tMax)}" fill="none" stroke="#b4235a" stroke-width="3"/><text x="24" y="145" font-size="10" fill="#667085">${String(points[0]?.time||'').slice(11,16)}</text><text x="340" y="145" font-size="10" fill="#667085">${String(points[points.length-1]?.time||'').slice(11,16)}</text><text x="28" y="22" font-size="10" fill="#b4235a">${tMax}℃</text><text x="28" y="126" font-size="10" fill="#b4235a">${tMin}℃</text></svg>`;
      document.querySelector("#bars").innerHTML=(loc.hourly||[]).slice(0,12).map(x=>`<div class="bar"><span>${String(x.time).slice(11,16)}</span><div class="track"><div class="fill" style="width:${Math.min(100,x.rainProb||0)}%"></div></div><span>${x.rainProb??"-"}%</span></div>`).join("");
      document.querySelector("#hourly").innerHTML=(loc.hourly||[]).slice(0,24).map(x=>`<div class="row"><span>${String(x.time).slice(11,16)}</span><span>${x.temp}℃</span><span>雨${x.rainProb??"-"}%</span><span>湿${x.humidity??"-"}%</span><span>${x.rain}mm</span><span>${x.wind}km/h</span></div>`).join("");
      document.querySelector("#daily").innerHTML=(loc.daily||[]).map(x=>`<div class="row"><span>${String(x.date).slice(5)}</span><span>${x.min}℃</span><span>${x.max}℃</span><span>雨${x.rain}mm</span><span>code ${x.code}</span></div>`).join("");
    }).catch(()=>{});
  </script>
</body>
</html>
