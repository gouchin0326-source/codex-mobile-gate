<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天気予報 | CODEXGATE</title>
  <style>
    :root{--bg:#f4f6f8;--panel:#fff;--ink:#172033;--muted:#667085;--line:#d9dee7;--blue:#2563eb;--green:#15803d;--rain:#0f6bdc;--temp:#b4235a;--humid:#0f766e;font-family:"Segoe UI","Meiryo",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.45}a{color:inherit}.wrap{width:min(940px,calc(100% - 18px));margin:auto}header{background:#172033;color:#fff;padding:12px 0;border-bottom:4px solid var(--green)}h1{margin:0;font-size:1.55rem}.sub{margin:3px 0 0;color:#dce5f3;font-weight:900;font-size:.86rem}main{display:grid;gap:8px;padding:8px 0 22px}section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}h2{font-size:1.02rem;margin:0 0 6px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:8px}.risk,.nowcard{border:1px solid var(--line);border-radius:8px;background:#f9fafb;padding:9px}.risk{background:#fff7ed;border-color:#f59e0b}.risk.warn{background:#fff1f2;border-color:#b4235a}.risk b,.nowcard b{display:block;font-size:1.18rem}.risk span,.nowcard span{display:block;color:var(--muted);font-size:.82rem;font-weight:900}.nowgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.metric{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px;min-width:0}.metric b{font-size:1.16rem;overflow-wrap:anywhere}.metric span{font-size:.75rem}.chart{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px;background:#fbfcfe}.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:.8rem;font-weight:900}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px}.temp{background:var(--temp)}.rain{background:var(--rain)}.humid{background:var(--humid)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:7px}.pill{border:1px solid var(--line);border-radius:8px;background:#f9fafb;padding:7px;font-weight:900}.pill b{display:block;font-size:1rem}.pill span{display:block;color:var(--muted);font-size:.72rem}.rainbars{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;min-height:126px;border:1px solid var(--line);border-radius:8px;background:#fbfcfe;padding:8px}.rainbar{display:grid;align-items:end;gap:3px;text-align:center;font-size:.66rem;color:var(--muted);font-weight:900}.rainbar i{display:block;min-height:4px;border-radius:6px 6px 2px 2px;background:linear-gradient(#38bdf8,var(--rain))}.rainbar b{font-size:.7rem;color:var(--ink)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.hour,.day{border:1px solid var(--line);border-radius:8px;background:#f9fafb;padding:8px;font-weight:900}.hour b,.day b{display:block;font-size:1rem}.hour span,.day span{display:block;color:var(--muted);font-size:.74rem;margin-top:2px}.tag{display:inline-grid;place-items:center;min-height:22px;padding:2px 6px;border-radius:999px;background:#e0f2fe;color:#075985;font-size:.68rem;margin-bottom:4px}.radar{display:grid;grid-template-columns:1fr 128px;gap:8px;align-items:center}.tiles{display:grid;grid-template-columns:repeat(3,1fr);border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#e0f2fe,#dcfce7);border:1px solid var(--line)}.tiles img{width:100%;aspect-ratio:1;object-fit:cover;background:transparent}.radar a,.back{display:inline-grid;place-items:center;min-height:40px;padding:8px 12px;border-radius:8px;background:var(--blue);color:#fff;text-decoration:none;font-weight:900}.meta{color:var(--muted);font-size:.82rem;font-weight:800;margin:5px 0 0}@media(max-width:640px){.hero{grid-template-columns:1fr}.nowgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.rainbars{grid-template-columns:repeat(6,1fr)}.radar{grid-template-columns:1fr}.tiles{width:150px}.metric b{font-size:1.02rem}.hour,.day{padding:7px}}
  </style>
</head>
<body>
  <header><div class="wrap"><h1>天気予報</h1><p class="sub">富山県 / Open-Meteo + 気象庁ナウキャスト / Codex 0%運用</p></div></header>
  <main class="wrap">
    <section class="hero">
      <div class="risk" id="risk"><b>読込中</b><span>富山県</span></div>
      <div class="nowcard"><b id="now-title">現在</b><div class="nowgrid" id="now"></div><p class="meta" id="meta">スクレイピングなし</p></div>
    </section>
    <section><h2>24時間 見通し</h2><div id="chart"></div><div class="legend"><span><i class="dot temp"></i>気温 左軸</span><span><i class="dot rain"></i>降水確率 右軸</span><span><i class="dot humid"></i>湿度 右軸</span></div><div class="summary" id="numbers"></div></section>
    <section><h2>雨の強さ</h2><div class="rainbars" id="rainbars"></div></section>
    <section><h2>雨雲ナウキャスト</h2><div class="radar"><div><p class="meta" id="nowcast-meta">気象庁公式タイルを表示。降水なしは透明。</p><a href="https://www.jma.go.jp/bosai/nowc/" target="_blank" rel="noreferrer">公式で開く</a></div><div class="tiles" id="tiles"></div></div></section>
    <section><h2>今後24時間</h2><div class="cards" id="hourly"></div></section>
    <section><h2>7日間</h2><div class="cards" id="daily"></div></section>
    <a class="back" href="../index.html">CGへ戻る</a>
  </main>
  <script>
    const fmt=(t)=>String(t||"").slice(11,16);
    const day=(t)=>String(t||"").slice(5).replace("-","/");
    const icon=(code)=>code>=80?"雨":code>=61?"雨":code>=51?"小雨":code>=45?"霧":code>=3?"曇":"晴";
    const maxOf=(rows,key)=>Math.max(...rows.map(x=>Number(x[key])||0),1);
    const y=(v,min,max)=>132-((Number(v)||0)-min)/(max-min||1)*104;
    fetch("../data/weather-info.json?v="+Date.now()).then(r=>r.ok?r.json():null).then(data=>{
      const loc=(data&&data.locations&&data.locations[0])||null;if(!loc)return;
      const c=loc.current||{}, risk=data.risk||{}, points=(loc.hourly||[]).slice(0,24);
      document.querySelector("#risk").className=`risk ${risk.level==="warning"?"warn":""}`;
      document.querySelector("#risk").innerHTML=`<b>${risk.label||"通常"}</b><span>${(risk.lines||[]).join(" / ")}</span>`;
      document.querySelector("#now-title").textContent=`現在 ${fmt(c.time)} ${icon(c.weather_code)}`;
      document.querySelector("#meta").textContent=`更新 ${data.updatedAt} / ${data.codexTokenUse}`;
      document.querySelector("#now").innerHTML=[["気温",`${c.temperature_2m??"-"}℃`],["体感",`${c.apparent_temperature??"-"}℃`],["湿度",`${c.relative_humidity_2m??"-"}%`],["雨",`${c.precipitation??"-"}mm`],["風",`${c.wind_speed_10m??"-"}km/h`],["警戒",risk.label||"通常"]].map(x=>`<div class="metric"><b>${x[1]}</b><span>${x[0]}</span></div>`).join("");
      const temps=points.map(x=>Number(x.temp)).filter(Number.isFinite), tMin=Math.floor(Math.min(...temps)-1), tMax=Math.ceil(Math.max(...temps)+1);
      const path=(key,min,max)=>points.map((x,i)=>`${i?"L":"M"}${38+i*(324/Math.max(1,points.length-1))},${y(x[key],min,max)}`).join(" ");
      const xTicks=points.filter((_,i)=>i%6===0).map((p,i)=>`<line x1="${38+i*6*(324/Math.max(1,points.length-1))}" y1="132" x2="${38+i*6*(324/Math.max(1,points.length-1))}" y2="136" stroke="#667085"/><text x="${30+i*6*(324/Math.max(1,points.length-1))}" y="148" font-size="10" fill="#667085">${fmt(p.time)}</text>`).join("");
      document.querySelector("#chart").innerHTML=`<svg class="chart" viewBox="0 0 400 158" role="img" aria-label="横軸は時刻、左軸は気温、右軸は降水確率と湿度"><line x1="38" y1="28" x2="38" y2="132" stroke="#667085"/><line x1="362" y1="28" x2="362" y2="132" stroke="#667085"/><line x1="38" y1="132" x2="362" y2="132" stroke="#667085"/><line x1="38" y1="80" x2="362" y2="80" stroke="#d9dee7"/><text x="4" y="34" font-size="10" fill="#b4235a">${tMax}℃</text><text x="7" y="132" font-size="10" fill="#b4235a">${tMin}℃</text><text x="366" y="34" font-size="10" fill="#2563eb">100%</text><text x="372" y="132" font-size="10" fill="#2563eb">0%</text>${xTicks}<path d="${path("rainProb",0,100)}" fill="none" stroke="#0f6bdc" stroke-width="3"/><path d="${path("humidity",0,100)}" fill="none" stroke="#0f766e" stroke-width="3"/><path d="${path("temp",tMin,tMax)}" fill="none" stroke="#b4235a" stroke-width="3"/></svg>`;
      document.querySelector("#numbers").innerHTML=points.filter((_,i)=>i%3===0).slice(0,8).map(x=>`<div class="pill"><b>${fmt(x.time)} ${x.temp}℃</b><span>雨${x.rainProb??"-"}% / 湿${x.humidity??"-"}% / 風${x.wind??"-"}</span></div>`).join("");
      const maxRain=maxOf(points.slice(0,12),"rainProb");
      document.querySelector("#rainbars").innerHTML=points.slice(0,12).map((x,i)=>`<div class="rainbar"><b>${x.rainProb??0}%</b><i style="height:${Math.max(4,((x.rainProb||0)/maxRain)*86)}px"></i><span>${i===0?"今":fmt(x.time)}</span></div>`).join("");
      const nc=data.nowcast||{};
      document.querySelector("#nowcast-meta").textContent=`${nc.label||"気象庁"} / 最新 ${String((nc.times||[])[0]?.validtime||"").slice(8,12)} / ${nc.note||""}`;
      document.querySelector("#tiles").innerHTML=(nc.tiles||[]).slice(0,9).map(t=>`<img src="${t.url}" alt="富山周辺の降水ナウキャストタイル">`).join("");
      document.querySelector("#hourly").innerHTML=points.slice(0,12).map((x,i)=>`<div class="hour"><em class="tag">${i===0?"今":"+"+i+"h"}</em><b>${fmt(x.time)} ${x.temp}℃</b><span>雨${x.rainProb??"-"}% / ${x.rain??0}mm</span><span>湿${x.humidity??"-"}% / 風${x.wind??"-"}km/h</span></div>`).join("");
      document.querySelector("#daily").innerHTML=(loc.daily||[]).map((x,i)=>`<div class="day"><em class="tag">${i===0?"今日":day(x.date)}</em><b>${x.min}℃ - ${x.max}℃</b><span>雨量 ${x.rain??0}mm</span><span>${icon(x.code)}</span></div>`).join("");
    }).catch(()=>{});
  </script>
</body>
</html>
