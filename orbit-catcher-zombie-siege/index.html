<!doctype html>
<html lang="ja">
<head>

  <title>Orbit Catcher: Zombie Siege</title>
  <style>

    .stick-knob { width:56px; height:56px; border-radius:999px; background:#1d4ed8; color:#fff; display:grid; place-items:center; font-size:12px; font-weight:800; position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); box-shadow:0 8px 20px rgba(37,99,235,.28); pointer-events:none; }
    .round { width:82px; height:82px; border-radius:999px; font-size:14px; }
    .fire { background:var(--red); border-color:var(--red); }
    .grenade { background:var(--green); border-color:var(--green); }
    .swap { background:#475569; border-color:#475569; }
    .aim { background:#7c3aed; border-color:#7c3aed; }
    .weapon-panel { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
    .weapon-card { min-height:52px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); display:grid; place-items:center; gap:2px; padding:5px; }

    .weapon-card span { color:var(--muted); font-size:10px; }

    .tool-card { min-height:46px; border:1px solid var(--line); border-radius:8px; background:#fff; display:grid; place-items:center; gap:2px; padding:5px; }
    .control-note { grid-column:1 / -1; color:var(--muted); font-size:12px; text-align:center; }
    .status-line { min-height:18px; color:var(--muted); font-size:12px; }
    @media (max-width:920px) { body { overflow:hidden; } header { display:none; } main { height:100dvh; min-height:0; grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); } aside { border-right:0; border-bottom:1px solid var(--line); padding:4px; gap:4px; grid-template-columns:64px 64px minmax(150px,1fr) minmax(150px,1fr); align-content:start; } aside > button, #sound, #export-result, #export-markdown, #export-ai-prompt, #reset-best, #export-status, .panel.hide-mobile { display:none; } #start, #pause { display:block; min-height:28px; padding:3px 4px; font-size:11px; } .stats { grid-column:1 / -1; grid-template-columns:repeat(5, minmax(0,1fr)); gap:3px; } .stat { padding:3px 4px; min-height:27px; } .stat:nth-child(2), .stat:nth-child(7), .stat:nth-child(8) { display:none; } .stat strong { font-size:13px; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .stat span { font-size:9px; line-height:1; white-space:nowrap; } .panel { padding:3px; gap:3px; } .panel > strong { display:none; } .panel:nth-of-type(1), .panel:nth-of-type(2) { display:none; } .weapon-panel, .tool-panel { gap:3px; } .weapon-card, .tool-card { min-height:28px; padding:2px; border-radius:6px; } .weapon-card strong, .tool-card strong { font-size:10px; } .weapon-card span, .tool-card span { font-size:9px; } .play-wrap { min-height:0; grid-template-rows:minmax(0,1fr) auto; gap:4px; padding:4px; } .stage { width:100%; height:100%; max-height:none; aspect-ratio:auto; align-self:stretch; } .overlay { inset:auto 6px 6px 6px; font-size:10px; } .badge { min-height:20px; padding:2px 6px; } .controls { padding:4px; gap:4px; grid-template-columns:1fr 50px 50px 50px; } .control-note { display:none; } .stick { width:96px; height:96px; } .stick::before { inset:15px; } .stick-knob { width:40px; height:40px; font-size:9px; } .round { width:48px; height:48px; min-height:48px; font-size:9px; } }
    @media (max-width:560px) { aside { grid-template-columns:48px 48px minmax(116px,1fr) minmax(116px,1fr); } .stats { grid-template-columns:repeat(5, minmax(0,1fr)); } .stat { padding:2px 3px; min-height:24px; } .stat strong { font-size:11px; } .stat span { font-size:8px; } #start, #pause { min-height:26px; font-size:10px; } .weapon-card, .tool-card { min-height:26px; } .controls { grid-template-columns:1fr 46px 46px 46px; } .stick { width:88px; height:88px; } .stick-knob { width:36px; height:36px; font-size:8px; } .round { width:44px; height:44px; min-height:44px; font-size:8px; } }
  </style>
</head>
<body>
  <header><h1>Orbit Catcher: Zombie Siege</h1><div class="muted">ゾンビ制圧・銃撃特化版</div></header>
  <main>

      <div class="status-line" id="export-status" role="status" aria-live="polite"></div>
      <div class="panel"><strong>状態</strong><div class="gauges"><div class="gauge-row"><span>耐久</span><div class="gauge"><div class="gauge-fill" id="hp-bar"></div></div><span id="hp-read">100</span></div><div class="gauge-row"><span>装填</span><div class="gauge"><div class="gauge-fill ammo" id="clip-bar"></div></div><span id="clip-read">12</span></div></div></div>
      <div class="panel"><strong>移動</strong><div class="gauges"><div class="gauge-row"><span>体力</span><div class="gauge"><div class="gauge-fill" id="stamina-bar"></div></div><span id="stamina-read">100</span></div></div></div>
      <div class="panel"><strong>銃</strong><div class="weapon-panel"><button class="weapon-card" data-weapon="0"><strong>HG</strong><span id="gun-0">12/72</span></button><button class="weapon-card" data-weapon="1"><strong>SG</strong><span id="gun-1">6/36</span></button><button class="weapon-card" data-weapon="2"><strong>MG</strong><span id="gun-2">30/150</span></button></div></div>
      <div class="panel"><strong>武器道具</strong><div class="tool-panel"><button class="tool-card" data-tool="grenade"><strong>GR</strong><span id="tool-grenade">2</span></button><button class="tool-card" data-tool="molotov"><strong>MO</strong><span id="tool-molotov">1</span></button><button class="tool-card" data-tool="mine"><strong>MI</strong><span id="tool-mine">1</span></button></div></div>
      <div class="panel hide-mobile"><strong>仕様</strong><div class="muted">これは別バージョンです。歩くゾンビの大群を銃で制圧します。走るゾンビ、のけぞり、射撃モーション、手りゅう弾、銃種切替を重視します。</div></div>
    </aside>
    <div class="play-wrap">
      <div class="stage"><canvas id="game" width="940" height="705" aria-label="Zombie Siege game canvas"></canvas><div class="overlay"><span class="badge" id="state">準備中</span><span class="badge" id="effect">通常</span></div></div>
      <div class="controls"><div class="stick" id="stick" role="application" aria-label="移動スティック"><div class="stick-knob" id="stickKnob">移動</div></div><button class="round aim" id="aim-mode">自動</button><button class="round grenade" id="grenade">投げる</button><button class="round swap" id="backpedal">後退</button><div class="control-note">射撃は常時オート。Sまたは後退ボタンで後ずさり射撃。銃と道具は上パネルでワンタップ。</div></div>
    </div>
  </main>
  <script>
    const canvas = document.querySelector("#game");

    const hpBarEl = document.querySelector("#hp-bar"), clipBarEl = document.querySelector("#clip-bar"), staminaBarEl = document.querySelector("#stamina-bar"), hpReadEl = document.querySelector("#hp-read"), clipReadEl = document.querySelector("#clip-read"), staminaReadEl = document.querySelector("#stamina-read");

    const startButton = document.querySelector("#start"), pauseButton = document.querySelector("#pause"), soundButton = document.querySelector("#sound"), exportButton = document.querySelector("#export-result"), exportMarkdownButton = document.querySelector("#export-markdown"), exportAiPromptButton = document.querySelector("#export-ai-prompt"), resetBestButton = document.querySelector("#reset-best"), grenadeButton = document.querySelector("#grenade"), aimButton = document.querySelector("#aim-mode"), backpedalButton = document.querySelector("#backpedal");

    const stick = document.querySelector("#stick"), stickKnob = document.querySelector("#stickKnob");
    const bestKey = "codex.orbit-catcher.zombie-siege.best.v1";
    const world = { w:3600, h:2600 };

    const keys = new Set();
    const controls = { backpedal:false };

    const pointer = { x:canvas.width / 2, y:canvas.height / 2, active:false };
    const audio = { enabled:false, ctx:null, nextBeat:0 };
    const weapons = [

    const stars = Array.from({ length:100 }, () => ({ x:Math.random() * world.w, y:Math.random() * world.h, a:Math.random() * .35 + .12 }));
    let best = readBest(), running = false, paused = false, lastTime = 0, score = 0, wave = 1, hp = 100, stamina = 100, sprinting = false, aimMode = "auto", kills = 0, weaponIndex = 0, reloadTimer = 0, fireCooldown = 0, spawnTimer = 0, itemTimer = 4, allyTimer = 7, waveTimer = 0, muzzle = 0, recoil = 0, direction = 0, lastResult = null;

    function rand(min, max) { return min + Math.random() * (max - min); }

    function drawItem(item) { const color = item.type === "weapon" ? "#a78bfa" : item.type === "grenade" ? "#16a34a" : item.type === "heal" ? "#22c55e" : item.type === "molotov" ? "#f97316" : item.type === "mine" ? "#f59e0b" : "#f59e0b"; sprite(sx(item.x), sy(item.y), 4, color, "item"); }
    function drawFire(f){ const pulse=Math.sin(performance.now()/120+(f.phase||0))*8; ctx.globalAlpha=.25; ctx.fillStyle="#f97316"; ctx.beginPath();ctx.arc(sx(f.x),sy(f.y),f.r+pulse,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.55;ctx.fillStyle="#facc15";ctx.beginPath();ctx.arc(sx(f.x),sy(f.y),f.r*.55+pulse*.4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1; }
    function draw() { drawBackground(); fires.forEach(drawFire); mines.forEach((m)=>{ctx.fillStyle=m.armed?"#f59e0b":"#64748b";ctx.fillRect(sx(m.x)-8,sy(m.y)-5,16,10);}); items.forEach(drawItem); recruits.forEach(drawRecruit); bullets.forEach((b)=>{ctx.fillStyle=b.slow?"#c4b5fd":b.ally?"#93c5fd":"#f8fafc";ctx.beginPath();ctx.arc(sx(b.x),sy(b.y),b.r,0,Math.PI*2);ctx.fill();}); throwables.forEach((g)=>{ctx.fillStyle=g.type==="molotov"?"#f97316":g.type==="mine"?"#f59e0b":"#16a34a";ctx.beginPath();ctx.arc(sx(g.x),sy(g.y),g.r,0,Math.PI*2);ctx.fill();}); zombies.forEach(drawZombie); allies.forEach(drawAlly); drawPlayer(); particles.forEach((p)=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(sx(p.x),sy(p.y),p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}); ctx.fillStyle="rgba(226,232,240,.92)"; ctx.font="600 16px Segoe UI, sans-serif"; const b=currentBuilding(); ctx.fillText("Zombies "+zombies.length+"  Wave "+wave+"  Aim "+aimMode+(b ? "  Inside "+b.name : ""),16,28); if (!running && score === 0) { ctx.textAlign="center"; ctx.font="700 30px Segoe UI, sans-serif"; ctx.fillText("Press Start",canvas.width/2,canvas.height/2); ctx.textAlign="left"; } if (paused) { ctx.textAlign="center"; ctx.font="700 30px Segoe UI, sans-serif"; ctx.fillText("Paused",canvas.width/2,canvas.height/2); ctx.textAlign="left"; } }
    function loop(now) { const dt=Math.min(.033,(now-lastTime)/1000||0); lastTime=now; update(dt,now); draw(); requestAnimationFrame(loop); }
    function togglePause() { if (!running) return; paused=!paused; pauseButton.textContent=paused?"再開":"一時停止"; flash(paused?"一時停止":"制圧中"); }
    function downloadText(filename, text, type) { const blob=new Blob([text],{type}); const url=URL.createObjectURL(blob); const link=document.createElement("a"); link.href=url; link.download=filename; document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url); exportStatusEl.textContent=`${filename} を書き出しました`; }
    function payload() { return { exportedAt:new Date().toISOString(), game:"Orbit Catcher: Zombie Siege", current:{ score,best,wave,hp:Number(hp.toFixed(1)),stamina:Number(stamina.toFixed(1)),sprinting,aimMode,kills,tools,weapon:weapon().id,ammo:ammoState,zombieCount:zombies.length,allyCount:allies.length,running,paused }, lastResult }; }
    function exportResult() { downloadText("orbit-catcher-zombie-siege-result.json", JSON.stringify(payload(), null, 2), "application/json;charset=utf-8"); }
    function exportMarkdown() { const p=payload(), r=p.lastResult||p.current; const lines=["# Orbit Catcher: Zombie Siege 結果","",`- 書き出し: ${p.exportedAt}`,`- 得点: ${r.score}`,`- 襲撃: ${r.wave}`,`- 撃破: ${r.kills}`,`- 武器: ${r.weapon}`,`- 手りゅう弾: ${(r.tools && r.tools.grenade) ?? 0}`,"","## 次の制作観点","","- ゾンビ歩行アニメの増量","- 被弾時ののけぞりと出血表現","- ピストル/ショットガン/マシンガンの音差","- 手りゅう弾の爆発演出"]; downloadText("orbit-catcher-zombie-siege-result.md", lines.join("\n"), "text/markdown;charset=utf-8"); }
    function exportAiPrompt() { downloadText("orbit-catcher-zombie-siege-ai-prompt.txt", `HTML5 Canvasのゾンビ制圧ゲームです。歩くゾンビ大量発生、たまに走るゾンビ、銃撃ののけぞり、銃種、手りゅう弾を強化したいです。次に小さく実装すべき5点を提案してください。\n\n${JSON.stringify(payload(), null, 2)}`, "text/plain;charset=utf-8"); }
    function toggleAim(){ aimMode = aimMode === "auto" ? "manual" : "auto"; flash(aimMode === "auto" ? "自動照準" : "手動照準"); updateHud(); }
    function setControl(name,value){controls[name]=value;}
    function updateStickFromPointer(event){const rect=stick.getBoundingClientRect(); const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2, max=rect.width/2-29; const rawX=event.clientX-cx, rawY=event.clientY-cy, dist=Math.hypot(rawX,rawY), limited=Math.min(max,dist||0), angle=Math.atan2(rawY,rawX); const kx=Math.cos(angle)*limited, ky=Math.sin(angle)*limited; stickState.x=max?kx/max:0; stickState.y=max?ky/max:0; stickState.power=max?Math.min(1,dist/max):0; stickKnob.style.transform=`translate(calc(-50% + ${kx}px), calc(-50% + ${ky}px))`; }
    function resetStick(){stickState.active=false; stickState.x=0; stickState.y=0; stickState.power=0; stickState.pointerId=null; stickKnob.style.transform="translate(-50%, -50%)";}
    window.addEventListener("keydown",(e)=>{const k=e.key.toLowerCase(); if(["arrowleft","arrowright","arrowup","arrowdown","a","d","w","s"," "].includes(k)){e.preventDefault(); keys.add(k);} if(k==="g") throwTool("grenade"); if(k==="f") throwTool("molotov"); if(k==="m") throwTool("mine"); if(k==="q") cycleWeapon(); if(k==="e") toggleAim(); if(k==="p") togglePause();});
    window.addEventListener("keyup",(e)=>keys.delete(e.key.toLowerCase()));
    canvas.addEventListener("pointermove",(e)=>{const r=canvas.getBoundingClientRect(); pointer.x=(e.clientX-r.left)*canvas.width/r.width; pointer.y=(e.clientY-r.top)*canvas.height/r.height; pointer.active=true;});
    document.querySelectorAll("[data-control]").forEach((button)=>{const name=button.dataset.control; button.addEventListener("pointerdown",(e)=>{e.preventDefault();setControl(name,true);button.setPointerCapture(e.pointerId);}); button.addEventListener("pointerup",()=>setControl(name,false)); button.addEventListener("pointercancel",()=>setControl(name,false)); button.addEventListener("pointerleave",()=>setControl(name,false));});
    stick.addEventListener("pointerdown",(e)=>{e.preventDefault();stickState.active=true;stickState.pointerId=e.pointerId;stick.setPointerCapture(e.pointerId);updateStickFromPointer(e);});
    stick.addEventListener("pointermove",(e)=>{if(stickState.active&&e.pointerId===stickState.pointerId)updateStickFromPointer(e);});
    stick.addEventListener("pointerup",(e)=>{if(e.pointerId===stickState.pointerId)resetStick();});
    stick.addEventListener("pointercancel",resetStick);
    startButton.addEventListener("click",resetRound); pauseButton.addEventListener("click",togglePause); soundButton.addEventListener("click",()=>{audio.enabled=!audio.enabled; soundButton.textContent=audio.enabled?"音 OFF":"音 ON"; if(audio.enabled){ensureAudio();tone(660,.12,"sine",.04);}}); grenadeButton.addEventListener("click",()=>throwTool("grenade")); aimButton.addEventListener("click",toggleAim); backpedalButton.addEventListener("pointerdown",()=>controls.backpedal=true); backpedalButton.addEventListener("pointerup",()=>controls.backpedal=false); backpedalButton.addEventListener("pointercancel",()=>controls.backpedal=false); exportButton.addEventListener("click",exportResult); exportMarkdownButton.addEventListener("click",exportMarkdown); exportAiPromptButton.addEventListener("click",exportAiPrompt); resetBestButton.addEventListener("click",()=>{best=0;writeBest(0);updateHud();}); weaponButtons.forEach((button)=>button.addEventListener("click",()=>setWeapon(Number(button.dataset.weapon)))); document.querySelectorAll("[data-tool]").forEach((button)=>button.addEventListener("click",()=>throwTool(button.dataset.tool)));
    updateHud(); draw(); requestAnimationFrame(loop);
  </script>
</body>
